<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - University Portal</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            font-family:
                'Poppins',
                'Segoe UI',
                sans-serif;

        }


        .signup-box {

            width: 100%;

            max-width: 380px;

            padding: 35px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.15);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 20px 40px
                rgba(0,0,0,0.25);

            color: #fff;

            animation:
                fadeIn 0.8s ease;

        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(-20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .signup-box h3 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 25px;

            font-weight: 600;

            font-size: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 500;

        }


        .form-control {

            width: 100%;

            border-radius: 10px;

            border: none;

            outline: none;

            padding: 12px;

            font-size: 15px;

            background: #fff;

            color: #333;

        }


        .form-control:focus {

            box-shadow:
                0 0 8px
                rgba(255,255,255,0.6);

        }


        .btn-custom {

            width: 100%;

            background:
                linear-gradient(
                    90deg,
                    #ff512f,
                    #dd2476
                );

            color: white;

            border: none;

            border-radius: 10px;

            padding: 12px;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;

        }


        .btn-custom:hover {

            transform:
                translateY(-2px);

            opacity: 0.9;

        }


        .btn-custom:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        .msg {

            background:
                rgba(0,0,0,0.3);

            padding: 9px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;

            font-size: 14px;

            display: none;

        }


        .success {

            display: block;

            color: #d4ffd8;

        }


        .error {

            display: block;

            color: #ffd0d0;

        }


        .footer-text {

            text-align: center;

            margin-top: 18px;

            font-size: 14px;

        }


        .footer-text a {

            color: #ffeaa7;

            text-decoration: none;

            font-weight: 600;

        }


        .footer-text a:hover {

            text-decoration: underline;

        }


        @media (max-width: 450px) {

            body {

                padding: 15px;

            }


            .signup-box {

                padding: 28px 22px;

            }


            .signup-box h3 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


    <div class="signup-box">

        <h3>Create Account</h3>


        <!-- Message -->

        <div
            id="message"
            class="msg"
        ></div>


        <!-- Registration Form -->

        <form id="signupForm">


            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Sign Up -->

            <button
                type="submit"
                class="btn-custom"
                id="signupButton"
            >
                Sign Up
            </button>


        </form>


        <!-- Login -->

        <div class="footer-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>

    </div>



    <!-- ==========================================
         FIREBASE
    =========================================== -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            setDoc
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



        // ==========================================
        // YOUR FIREBASE CONFIG
        // ==========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"

        };



        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        const app =
            initializeApp(firebaseConfig);



        // Firebase Authentication

        const auth =
            getAuth(app);



        // Firestore

        const db =
            getFirestore(app);



        // ==========================================
        // FORM ELEMENTS
        // ==========================================

        const signupForm =
            document.getElementById(
                "signupForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const signupButton =
            document.getElementById(
                "signupButton"
            );



        // ==========================================
        // SIGN UP
        // ==========================================

        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();



                // Get values

                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;



                // ==================================
                // VALIDATION
                // ==================================

                if (
                    name === "" ||
                    email === "" ||
                    password === "" ||
                    confirmPassword === ""
                ) {

                    showMessage(
                        "⚠️ Please fill all fields.",
                        "error"
                    );

                    return;

                }



                if (password.length < 6) {

                    showMessage(
                        "⚠️ Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }



                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "❌ Passwords do not match.",
                        "error"
                    );

                    return;

                }



                // Disable button

                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating Account...";



                try {

                    // ==================================
                    // CREATE AUTH ACCOUNT
                    // ==================================

                    const userCredential =
                        await
                        createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;



                    // ==================================
                    // SAVE USER IN FIRESTORE
                    // ==================================

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {

                            name: name,

                            email: email,

                            uid: user.uid,

                            createdAt:
                                new Date()

                        }
                    );



                    // ==================================
                    // SUCCESS
                    // ==================================

                    showMessage(
                        "✅ Account created successfully!",
                        "success"
                    );


                    signupForm.reset();



                    // Redirect to login

                    setTimeout(
                        function() {

                            window.location.href =
                                "login.html";

                        },
                        1500
                    );



                } catch (error) {

                    console.error(
                        "Firebase Error:",
                        error
                    );



                    // ==================================
                    // ERROR HANDLING
                    // ==================================

                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        showMessage(
                            "❌ This email is already registered.",
                            "error"
                        );

                    }


                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        showMessage(
                            "❌ Invalid email address.",
                            "error"
                        );

                    }


                    else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        showMessage(
                            "❌ Password is too weak.",
                            "error"
                        );

                    }


                    else {

                        showMessage(
                            "❌ Registration failed: " +
                            error.message,
                            "error"
                        );

                    }


                    // Enable button

                    signupButton.disabled =
                        false;

                    signupButton.textContent =
                        "Sign Up";

                }

            }
        );



        // ==========================================
        // MESSAGE FUNCTION
        // ==========================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "msg " + type;

        }

    </script>


</body>

</html>
