<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Manage Attendance</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#eef4ff;
    color:#102653;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.topbar{

    height:84px;

    background:#ffffff;

    display:flex;

    align-items:center;

    gap:18px;

    padding:
        14px
        28px;

    border-bottom:
        1px solid
        #dce5f4;

    position:sticky;

    top:0;

    z-index:100;

}


.menu-btn{

    border:0;

    background:transparent;

    color:#102653;

    font-size:31px;

    cursor:pointer;

    padding:4px;

}


.page-title{

    flex:1;

    font-size:29px;

    font-weight:800;

    color:#102653;

}


.top-btn{

    border:0;

    border-radius:16px;

    min-height:50px;

    padding:
        0 20px;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    color:#ffffff;

    background:
        linear-gradient(
            100deg,
            #46c4e7,
            #2057dc
        );

}


.refresh-btn{

    width:52px;

    padding:0;

    font-size:26px;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:1180px;

    margin:0 auto;

    padding:28px;

}


/* =====================================================
   CARDS
===================================================== */

.card{

    background:#ffffff;

    border-radius:28px;

    padding:25px;

    margin-bottom:23px;

    box-shadow:
        0 6px 24px
        rgba(
            44,
            83,
            145,
            .10
        );

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    padding:15px 18px;

    border-radius:14px;

    margin-bottom:18px;

    font-size:15px;

    line-height:1.5;

}


.error{

    background:#ffe8e8;

    color:#b92e38;

    border:
        1px solid
        #f3b9bd;

}


.success{

    background:#e6f8ee;

    color:#168b55;

    border:
        1px solid
        #bfe6d1;

}


.hidden{

    display:none !important;

}


/* =====================================================
   FORM GRID
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:17px;

}


.form-group{

    min-width:0;

}


.form-group label{

    display:block;

    margin-bottom:9px;

    font-size:15px;

    font-weight:700;

    color:#102653;

}


.form-control{

    width:100%;

    height:56px;

    padding:
        0 14px;

    border:
        2px solid
        #d8e3f3;

    border-radius:15px;

    background:#f7faff;

    color:#18345e;

    font-size:16px;

    outline:none;

    transition:.2s;

}


.form-control:focus{

    border-color:#5da1ed;

    background:#ffffff;

    box-shadow:
        0 0 0 3px
        rgba(
            64,
            143,
            229,
            .10
        );

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:11px;

    margin-top:20px;

}


.action-btn{

    border:0;

    border-radius:13px;

    padding:
        13px
        19px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


.present-btn{

    background:#e1f7eb;

    color:#14945a;

}


.absent-btn{

    background:#ffe6e9;

    color:#d43b46;

}


.action-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   INFO
===================================================== */

.info-box{

    margin-top:18px;

    padding:
        14px
        17px;

    border-radius:14px;

    background:#edf5ff;

    color:#3979c9;

    line-height:1.5;

}


/* =====================================================
   STUDENT HEADER
===================================================== */

.student-header{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

}


.student-header h2{

    margin:0;

    flex:1;

    font-size:25px;

}


.student-count{

    color:#8492a7;

    font-weight:700;

}


.save-btn{

    border:0;

    border-radius:16px;

    padding:
        13px
        21px;

    background:
        linear-gradient(
            100deg,
            #46c4e7,
            #2057dc
        );

    color:#ffffff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


.save-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    min-width:760px;

    border-collapse:collapse;

}


thead th{

    background:#edf4ff;

    color:#102653;

    text-align:left;

    padding:
        16px
        15px;

    font-size:15px;

    font-weight:800;

}


tbody td{

    padding:
        14px
        15px;

    border-bottom:
        1px solid
        #e4e9f1;

    font-size:15px;

}


tbody tr:hover td{

    background:#fafcff;

}



/* Individual attendance controls */
.status-buttons{
  display:flex;
  align-items:center;
  gap:10px;
}

.status-btn{
  min-width:52px;
  height:42px;
  border:2px solid transparent;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:800;
  transition:.15s ease;
}

.status-btn.present{
  background:#dff5e9;
  color:#15995a;
  border-color:#bfe8d1;
}

.status-btn.absent{
  background:#ffe3e6;
  color:#db3945;
  border-color:#f2c1c6;
}

.status-btn:hover{
  transform:translateY(-1px);
}

.status-btn.active{
  opacity:1;
  transform:scale(1.05);
  box-shadow:0 0 0 2px currentColor;
}

.status-btn:not(.active){
  opacity:.55;
}

@media(max-width:600px){
  .status-btn{
    min-width:48px;
    height:40px;
  }
}

/* =====================================================
   EMPTY
===================================================== */

.empty{

    text-align:center;

    padding:
        45px
        20px;

    color:#8492a7;

}


.empty-icon{

    font-size:46px;

    margin-bottom:10px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:35px;

    color:#5d6f8b;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .form-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

    }

}


@media(max-width:600px){

    .topbar{

        height:72px;

        padding:
            10px
            13px;

        gap:9px;

    }


    .menu-btn{

        font-size:27px;

    }


    .page-title{

        font-size:22px;

    }


    .top-btn{

        min-height:44px;

        padding:
            0 12px;

        border-radius:13px;

        font-size:14px;

    }


    .refresh-btn{

        width:45px;

        font-size:24px;

    }


    .container{

        padding:14px;

    }


    .card{

        padding:19px;

        border-radius:23px;

        margin-bottom:16px;

    }


    .form-grid{

        grid-template-columns:
            1fr
            1fr;

        gap:11px;

    }


    .form-group label{

        font-size:13px;

    }


    .form-control{

        height:51px;

        font-size:14px;

        padding:
            0 9px;

    }


    .student-header{

        flex-wrap:wrap;

    }


    .student-header h2{

        flex-basis:100%;

        font-size:22px;

    }


    .student-count{

        flex:1;

    }


    .save-btn{

        padding:
            11px
            14px;

        font-size:14px;

    }


    .action-btn{

        padding:
            11px
            13px;

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">

    <button
        class="menu-btn"
        type="button"
        aria-label="Menu"
        onclick="history.back()"
    >
        ☰
    </button>


    <div class="page-title">
        Manage Attendance
    </div>


    <button
        class="top-btn"
        type="button"
        onclick="history.back()"
    >
        ‹ Back
    </button>


    <button
        id="refreshBtn"
        class="top-btn refresh-btn"
        type="button"
        title="Refresh"
    >
        ↻
    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="message error hidden"
    ></div>


    <!-- SUCCESS -->

    <div
        id="successMessage"
        class="message success hidden"
    ></div>



    <!-- =================================================
         FILTER CARD
    ================================================== -->

    <section class="card">


        <div class="form-grid">


            <!-- DATE -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    id="date"
                    class="form-control"
                    type="date"
                >

            </div>



            <!-- SEMESTER -->

            <div class="form-group">

                <label for="semester">
                    Semester
                </label>

                <select
                    id="semester"
                    class="form-control"
                >

                    <option value="Sem-1">
                        Sem-1
                    </option>

                    <option value="Sem-2">
                        Sem-2
                    </option>

                    <option
                        value="Sem-3"
                        selected
                    >
                        Sem-3
                    </option>

                    <option value="Sem-4">
                        Sem-4
                    </option>

                    <option value="Sem-5">
                        Sem-5
                    </option>

                    <option value="Sem-6">
                        Sem-6
                    </option>

                    <option value="Sem-7">
                        Sem-7
                    </option>

                    <option value="Sem-8">
                        Sem-8
                    </option>

                </select>

            </div>



            <!-- SECTION -->

            <div class="form-group">

                <label for="section">
                    Section
                </label>

                <select
                    id="section"
                    class="form-control"
                >

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C
                    </option>

                </select>

            </div>



            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject / Lecture
                </label>

                <select
                    id="subject"
                    class="form-control"
                >

                    <option value="">
                        Loading subjects...
                    </option>

                </select>

            </div>


        </div>



        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="allPresent"
                class="action-btn present-btn"
                type="button"
            >
                ✓ Mark All Present
            </button>


            <button
                id="allAbsent"
                class="action-btn absent-btn"
                type="button"
            >
                × Mark All Absent
            </button>

        </div>



        <div class="info-box">

            Select date, semester, section and lecture.
            Then mark each student <b>✓ P</b> or <b>✕ A</b>.
            You can also use <b>Mark All Present</b> or
            <b>Mark All Absent</b>.

        </div>


    </section>



    <!-- =================================================
         STUDENTS CARD
    ================================================== -->

    <section class="card">


        <div class="student-header">

            <h2>
                Students
            </h2>


            <span
                id="studentCount"
                class="student-count"
            >
                0 students
            </span>


            <button
                id="saveAttendance"
                class="save-btn"
                type="button"
            >
                Save Attendance
            </button>

        </div>



        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Roll No.
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Section
                        </th>

                        <th>
                            Attendance
                        </th>

                    </tr>

                </thead>



                <tbody id="studentTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="loading"
                        >
                            Loading students...
                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </section>


</main>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where, doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",
  authDomain:"university-portal-2107e.firebaseapp.com",
  projectId:"university-portal-2107e",
  storageBucket:"university-portal-2107e.firebasestorage.app",
  messagingSenderId:"50848903813",
  appId:"1:50848903813:web:8296090d0d9268cfd2efec",
  measurementId:"G-LKTX7C7F0E"
};

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

let allStudents = [];
let allSubjects = [];
let attendanceRecords = [];
let selectedSubject = null;

const norm = v => String(v ?? "").trim().toLowerCase();

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function today(){
  const d = new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000)
    .toISOString().slice(0,10);
}

function error(msg){
  console.error("Manage Attendance:",msg);
  $("errorMessage").textContent = msg;
  $("errorMessage").classList.remove("hidden");
}

function clearError(){
  $("errorMessage").classList.add("hidden");
}

function success(msg){
  $("successMessage").textContent = msg;
  $("successMessage").classList.remove("hidden");
  setTimeout(()=>$("successMessage").classList.add("hidden"),5000);
}

/* ==================== STUDENTS ==================== */

async function loadStudents(){
  const snap = await getDocs(collection(db,"students"));

  allStudents = snap.docs.map(d=>({id:d.id,...d.data()}));

  console.log("TOTAL STUDENTS:",allStudents.length);
  console.table(allStudents);

  renderStudents();
}

function filteredStudents(){
  const section = norm($("section").value);
  const semester = norm($("semester").value);

  return allStudents
    .filter(s=>{
      if(s.active === false) return false;
      const studentSemester = norm(s.semester || s.semeter || "");
      return norm(s.section) === section &&
             studentSemester === semester;
    })
    .sort((a,b)=>
      String(a.rollNo || a.roll || "")
      .localeCompare(
        String(b.rollNo || b.roll || ""),
        undefined,
        {numeric:true}
      )
    );
}

function renderStudents(){
  const list = filteredStudents();
  const tbody = $("studentTableBody");

  $("studentCount").textContent = list.length + " students";

  if(!list.length){
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          <div class="empty-icon">👨‍🎓</div>
          No students found for
          <b>${esc($("section").value)}</b> /
          <b>${esc($("semester").value)}</b>
          <br><br>
          Firebase total students: ${allStudents.length}
        </td>
      </tr>`;
    return;
  }

  tbody.innerHTML = list.map((s,i)=>{
    const st = getStatus(s.id);
    return `
      <tr data-student-id="${esc(s.id)}" data-status="${st}">
        <td>${i+1}</td>
        <td><b>${esc(s.rollNo || s.roll || "—")}</b></td>
        <td>${esc(s.name || s.studentName || "Unnamed Student")}</td>
        <td>${esc(s.section || "—")}</td>
        <td>
          <div class="status-buttons">
            <button
              type="button"
              class="status-btn present ${st==="P"?"active":""}"
              data-status="P"
              aria-label="Mark Present"
              title="Present"
            >✓ P</button>

            <button
              type="button"
              class="status-btn absent ${st==="A"?"active":""}"
              data-status="A"
              aria-label="Mark Absent"
              title="Absent"
            >✕ A</button>
          </div>
        </td>
      </tr>`;
  }).join("");

  document.querySelectorAll("#studentTableBody [data-status]")
    .forEach(btn=>{
      btn.onclick=()=>{
        const row=btn.closest("tr");
        row.dataset.status=btn.dataset.status;
        row.querySelectorAll("[data-status]")
          .forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
      };
    });
}

/* ==================== SUBJECTS ==================== */

async function loadSubjects(){
  const snap = await getDocs(collection(db,"subjects"));

  allSubjects = snap.docs.map(d=>({id:d.id,...d.data()}));

  console.log("TOTAL SUBJECTS:",allSubjects.length);
  console.table(allSubjects);

  renderSubjects();
}

function renderSubjects(){
  const section=norm($("section").value);
  const semester=norm($("semester").value);

  const list=allSubjects
    .filter(s=>{
      if(s.active===false) return false;

      const ss=norm(s.section);
      const sm=norm(s.semester);

      return (!ss || ss===section) &&
             (!sm || sm===semester);
    })
    .sort((a,b)=>
      String(a.code || a.name || "")
      .localeCompare(String(b.code || b.name || ""))
    );

  $("subject").innerHTML =
    `<option value="">Select subject / lecture</option>`;

  list.forEach(s=>{
    const o=document.createElement("option");
    o.value=s.id;
    o.textContent=(s.code?s.code+" — ":"")+
                  (s.name||"Unnamed Subject");
    $("subject").appendChild(o);
  });

  if(!list.length){
    $("subject").innerHTML =
      `<option value="">No subject found</option>`;
  }
}

$("subject").onchange=()=>{
  selectedSubject=allSubjects.find(
    s=>s.id===$("subject").value
  ) || null;
  renderStudents();
};

/* ==================== ATTENDANCE ==================== */

async function loadAttendance(){
  attendanceRecords=[];

  if(!$("date").value){
    renderStudents();
    return;
  }

  const q=query(
    collection(db,"attendance"),
    where("date","==",$("date").value)
  );

  const snap=await getDocs(q);

  attendanceRecords=snap.docs.map(
    d=>({id:d.id,...d.data()})
  );

  renderStudents();
}

function getStatus(studentId){
  if(!selectedSubject) return "";

  const r=attendanceRecords.find(x=>
    String(x.studentId)===String(studentId) &&
    String(x.subjectId)===String(selectedSubject.id) &&
    String(x.date)===String($("date").value)
  );

  return String(r?.status || "").toUpperCase();
}

function attendanceId(studentId,date,subjectId){
  return `${studentId}_${date}_${subjectId}`
    .replace(/[\/\\#?\[\]\s]/g,"_");
}

/* ==================== FILTER EVENTS ==================== */

$("date").onchange=async()=>{
  try{
    clearError();
    await loadAttendance();
  }catch(e){ error("Attendance load nahi hui: "+e.message); }
};

$("section").onchange=async()=>{
  try{
    clearError();
    selectedSubject=null;
    $("subject").value="";
    renderSubjects();
    renderStudents();
    await loadAttendance();
  }catch(e){ error("Section change error: "+e.message); }
};

$("semester").onchange=async()=>{
  try{
    clearError();
    selectedSubject=null;
    $("subject").value="";
    renderSubjects();
    renderStudents();
    await loadAttendance();
  }catch(e){ error("Semester change error: "+e.message); }
};

/* ==================== MARK ALL ==================== */

function markAll(status){
  if(!selectedSubject){
    alert("Pehle Subject / Lecture select karein.");
    return;
  }

  document.querySelectorAll(
    "#studentTableBody tr[data-student-id]"
  ).forEach(row=>{
    row.dataset.status=status;
    row.querySelectorAll("[data-status]")
      .forEach(b=>b.classList.remove("active"));
    const b=row.querySelector(`[data-status="${status}"]`);
    if(b) b.classList.add("active");
  });
}

$("allPresent").onclick=()=>markAll("P");
$("allAbsent").onclick=()=>markAll("A");

/* ==================== SAVE ==================== */

$("saveAttendance").onclick=async()=>{
  clearError();

  if(!selectedSubject){
    alert("Pehle Subject / Lecture select karein.");
    return;
  }

  const rows=[...document.querySelectorAll(
    "#studentTableBody tr[data-student-id]"
  )];

  const marked=rows.filter(r=>
    r.dataset.status==="P" || r.dataset.status==="A"
  );

  if(!marked.length){
    alert("Students ko P ya A mark karein.");
    return;
  }

  const btn=$("saveAttendance");
  btn.disabled=true;
  btn.textContent="Saving...";

  try{
    let count=0;

    for(const row of marked){
      const student=allStudents.find(
        s=>String(s.id)===String(row.dataset.studentId)
      );

      if(!student) continue;

      await setDoc(
        doc(
          db,
          "attendance",
          attendanceId(
            student.id,
            $("date").value,
            selectedSubject.id
          )
        ),
        {
          studentId:student.id,
          studentName:student.name || student.studentName || "",
          rollNo:student.rollNo || student.roll || "",
          date:$("date").value,
          section:student.section || $("section").value,
          semester:student.semester || $("semester").value,
          subjectId:selectedSubject.id,
          subjectCode:selectedSubject.code || "",
          subjectName:selectedSubject.name || "",
          lectureType:selectedSubject.lectureType || "Theory",
          status:row.dataset.status,
          markedBy:"faculty",
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );

      count++;
    }

    await loadAttendance();
    success(`✓ Attendance saved successfully for ${count} students.`);
  }catch(e){
    error("Attendance save nahi hui: "+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Save Attendance";
  }
};

/* ==================== REFRESH ==================== */

$("refreshBtn").onclick=async()=>{
  const btn=$("refreshBtn");
  btn.disabled=true;

  try{
    clearError();
    await loadSubjects();
    await loadStudents();
    await loadAttendance();
    success("✓ Data refreshed.");
  }catch(e){
    error("Refresh failed: "+e.message);
  }finally{
    btn.disabled=false;
  }
};

/* ==================== INIT ==================== */

async function init(){
  try{
    clearError();

    $("date").value=today();
    $("semester").value="Sem-3";
    $("section").value="A";

    /*
      IMPORTANT:
      No localStorage/login dependency.
      Students and subjects are read directly
      from Firestore and filtered in the browser.
    */

    await loadSubjects();
    await loadStudents();
    await loadAttendance();

    console.log("MANAGE ATTENDANCE READY");
  }catch(e){
    error("Page load error: "+e.message);
  }
}

init();
</script>
