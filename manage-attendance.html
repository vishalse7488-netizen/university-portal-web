<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef4ff;
      color: #102654;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    .topbar {
      height: 86px;
      background: #ffffff;
      border-bottom: 1px solid #dbe5f4;

      display: flex;
      align-items: center;

      gap: 24px;
      padding: 0 32px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-btn,
    .refresh-btn {
      border: none;
      background: transparent;
      color: #102654;
      font-size: 32px;
    }

    .refresh-btn {
      font-size: 36px;
    }

    .page-title {
      flex: 1;
      font-size: 29px;
      font-weight: 900;
    }

    .back-btn {
      border: none;
      color: white;
      font-size: 18px;
      font-weight: 800;

      padding: 15px 26px;

      border-radius: 15px;

      background: linear-gradient(
        100deg,
        #4bc2e8,
        #2458d9
      );
    }

    /* ================= MAIN ================= */

    .container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 30px;
      padding: 28px;
      margin-bottom: 22px;

      box-shadow: 0 8px 30px rgba(80, 110, 160, 0.10);
    }

    .card-title {
      margin: 0 0 22px;

      font-size: 25px;
      font-weight: 900;
    }

    /* ================= SETUP ================= */

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;

      font-weight: 800;
    }

    .form-control {
      width: 100%;
      height: 58px;

      border: 2px solid #dce6f5;
      border-radius: 16px;

      background: #f7f9fd;

      padding: 0 14px;

      color: #182b55;

      outline: none;
    }

    .form-control:focus {
      border-color: #65a8ee;
    }

    /* ================= STUDENT HEADER ================= */

    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .search-box {
      width: 280px;
      height: 52px;

      border: 2px solid #dce6f5;
      border-radius: 15px;

      padding: 0 15px;

      outline: none;
    }

    .search-box:focus {
      border-color: #65a8ee;
    }

    /* ================= INFO ================= */

    .info-box {
      background: #eef7ff;
      color: #3975ad;

      padding: 14px 17px;

      border-radius: 14px;

      margin-bottom: 17px;
    }

    .error-box {
      background: #fff0f1;
      color: #d33f49;

      padding: 14px 17px;

      border-radius: 14px;

      margin-bottom: 17px;
    }

    .success-box {
      background: #eaf9f1;
      color: #24935d;

      padding: 14px 17px;

      border-radius: 14px;

      margin-bottom: 17px;
    }

    /* ================= BUTTONS ================= */

    .toolbar {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      margin-bottom: 20px;
    }

    .action-btn {
      border: none;

      padding: 13px 20px;

      border-radius: 15px;

      font-weight: 800;
    }

    .present-all {
      background: #eaf3ff;
      color: #2876cd;
    }

    .absent-all {
      background: #fff0f2;
      color: #db444b;
    }

    .save-btn {
      color: white;

      background: linear-gradient(
        100deg,
        #4bc2e8,
        #2458d9
      );
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ================= TABLE ================= */

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 760px;

      border-collapse: collapse;
    }

    th {
      background: #edf4fd;

      text-align: left;

      padding: 15px;

      font-size: 16px;
    }

    td {
      padding: 14px 15px;

      border-bottom: 1px solid #e4e9f0;
    }

    .student-name {
      font-weight: 800;
    }

    /* ================= STATUS ================= */

    .status-btn {
      min-width: 50px;

      padding: 9px 14px;

      margin-right: 6px;

      border-radius: 9px;

      border: 2px solid #dce4ef;

      background: white;

      font-weight: 900;
    }

    .status-btn.present.active {
      background: #e8f7ef;
      color: #209e62;
      border-color: #bde5d0;
    }

    .status-btn.absent.active {
      background: #fff0f1;
      color: #dc4047;
      border-color: #f0c5cb;
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;

      padding: 55px 20px;

      color: #8290a7;
    }

    /* ================= TOAST ================= */

    .toast {
      display: none;

      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 999;

      color: white;

      background: #13284f;

      padding: 15px 20px;

      border-radius: 14px;
    }

    .toast.show {
      display: block;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 850px) {

      .setup-grid {
        grid-template-columns: 1fr 1fr;
      }

      .topbar {
        padding: 0 15px;
      }

      .page-title {
        font-size: 23px;
      }
    }

    @media (max-width: 550px) {

      .setup-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 0 10px;
      }

      .card {
        padding: 20px;
        border-radius: 25px;
      }

      .student-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .back-btn {
        padding: 12px 16px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="topbar">

    <button
      class="menu-btn"
      onclick="history.back()">
      ☰
    </button>

    <div class="page-title">
      Manage Attendance
    </div>

    <button
      class="back-btn"
      onclick="history.back()">
      ‹ Back
    </button>

    <button
      class="refresh-btn"
      id="refreshBtn">
      ↻
    </button>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="container">

    <!-- ================= ATTENDANCE SETUP ================= -->

    <section class="card">

      <h2 class="card-title">
        📋 Attendance Setup
      </h2>

      <div class="setup-grid">

        <!-- DATE -->

        <div class="form-group">

          <label for="attendanceDate">
            Date
          </label>

          <input
            type="date"
            id="attendanceDate"
            class="form-control">

        </div>


        <!-- SECTION -->

        <div class="form-group">

          <label for="sectionSelect">
            Section
          </label>

          <select
            id="sectionSelect"
            class="form-control">

            <option value="">
              Loading sections...
            </option>

          </select>

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

          <label for="subjectInput">
            Subject
          </label>

          <input
            type="text"
            id="subjectInput"
            class="form-control"
            placeholder="e.g. V-Lecture">

        </div>


        <!-- LECTURE TYPE -->

        <div class="form-group">

          <label for="lectureType">
            Lecture Type
          </label>

          <select
            id="lectureType"
            class="form-control">

            <option value="Theory">
              Theory
            </option>

            <option value="Practical">
              Practical
            </option>

          </select>

        </div>

      </div>

    </section>


    <!-- ================= STUDENTS ================= -->

    <section class="card">

      <div class="student-header">

        <h2 class="card-title">
          👥 Student Attendance
        </h2>

        <input
          type="text"
          id="searchStudent"
          class="search-box"
          placeholder="Search student...">

      </div>


      <div class="info-box">

        Students are loaded directly from
        <b>Firestore → students</b>.

        Select a section, mark
        <b>P</b> or <b>A</b>,
        then save attendance.

      </div>


      <div id="messageBox"></div>


      <!-- BUTTONS -->

      <div class="toolbar">

        <button
          class="action-btn present-all"
          id="markAllPresent">

          ✓ Mark All Present

        </button>


        <button
          class="action-btn absent-all"
          id="markAllAbsent">

          × Mark All Absent

        </button>


        <button
          class="action-btn save-btn"
          id="saveAttendance">

          💾 Save Attendance

        </button>

      </div>


      <!-- TABLE -->

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>
                #
              </th>

              <th>
                Student
              </th>

              <th>
                Student ID
              </th>

              <th>
                Section
              </th>

              <th>
                Status
              </th>

            </tr>

          </thead>


          <tbody id="studentTableBody">

            <tr>

              <td
                colspan="5"
                class="empty">

                Loading students...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <div
    id="toast"
    class="toast">
  </div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==================================================
       FIREBASE CONFIG
    ================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

      authDomain:
        "university-portal-2107e.firebaseapp.com",

      projectId:
        "university-portal-2107e",

      storageBucket:
        "university-portal-2107e.firebasestorage.app",

      messagingSenderId:
        "50848903813",

      appId:
        "1:50848903813:web:8296090d0d9268cfd2efec",

      measurementId:
        "G-LKTX7C7F0E"

    };


    /* ==================================================
       INITIALIZE FIREBASE
    ================================================== */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    const studentsCollection =
      collection(db, "students  ");


    const attendanceCollection =
      collection(db, "attendance");


    /* ==================================================
       VARIABLES
    ================================================== */

    let students = [];

    let attendanceStatus = {};


    /* ==================================================
       ELEMENTS
    ================================================== */

    const dateInput =
      document.getElementById("attendanceDate");

    const sectionSelect =
      document.getElementById("sectionSelect");

    const subjectInput =
      document.getElementById("subjectInput");

    const lectureType =
      document.getElementById("lectureType");

    const searchInput =
      document.getElementById("searchStudent");

    const tableBody =
      document.getElementById("studentTableBody");

    const messageBox =
      document.getElementById("messageBox");

    const saveButton =
      document.getElementById("saveAttendance");

    const refreshButton =
      document.getElementById("refreshBtn");


    /* ==================================================
       DEFAULT DATE
    ================================================== */

    const today =
      new Date();

    today.setMinutes(
      today.getMinutes()
      - today.getTimezoneOffset()
    );

    dateInput.value =
      today.toISOString()
      .split("T")[0];


    /* ==================================================
       ESCAPE HTML
    ================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(
          /[&<>"']/g,
          function (character) {

            return {

              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;"

            }[character];

          }
        );

    }


    /* ==================================================
       GET FIELD
    ================================================== */

    function getField(
      data,
      possibleNames
    ) {

      for (
        const fieldName
        of possibleNames
      ) {

        if (
          data[fieldName] !== undefined &&
          data[fieldName] !== null &&
          String(data[fieldName]).trim() !== ""
        ) {

          return String(
            data[fieldName]
          ).trim();

        }

      }

      return "";

    }


    /* ==================================================
       STUDENT ID
    ================================================== */

    function getStudentId(
      data,
      documentId
    ) {

      return (

        getField(
          data,
          [
            "studentId",
            "studentID",
            "rollNumber",
            "rollNo",
            "registrationNo",
            "enrollmentNo"
          ]
        )

        || documentId

      );

    }


    /* ==================================================
       STUDENT NAME
    ================================================== */

    function getStudentName(data) {

      return (

        getField(
          data,
          [
            "name",
            "studentName",
            "fullName",
            "displayName"
          ]
        )

        || "Unnamed Student"

      );

    }


    /* ==================================================
       SECTION
    ================================================== */

    function getStudentSection(data) {

      return getField(
        data,
        [
          "section",
          "Section",
          "classSection",
          "class_section"
        ]
      );

    }


    /* ==================================================
       MESSAGE
    ================================================== */

    function showError(message) {

      messageBox.innerHTML =
        `<div class="error-box">
          ${message}
        </div>`;

    }


    function showSuccess(message) {

      messageBox.innerHTML =
        `<div class="success-box">
          ${message}
        </div>`;

    }


    /* ==================================================
       TOAST
    ================================================== */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent =
        message;

      toast.classList.add("show");

      setTimeout(
        () => {
          toast.classList.remove("show");
        },
        3000
      );

    }


    /* ==================================================
       LOAD STUDENTS
    ================================================== */

    async function loadStudents() {

      tableBody.innerHTML =
        `<tr>
          <td
            colspan="5"
            class="empty">

            Loading students...

          </td>
        </tr>`;


      sectionSelect.innerHTML =
        `<option value="">
          Loading sections...
        </option>`;


      messageBox.innerHTML = "";


      try {

        const snapshot =
          await getDocs(
            studentsCollection
          );


        console.log(
          "Firestore students:",
          snapshot.size
        );


        students =
          snapshot.docs.map(
            documentSnapshot => ({

              documentId:
                documentSnapshot.id,

              ...documentSnapshot.data()

            })
          );


        /* =========================
           EMPTY COLLECTION
        ========================= */

        if (students.length === 0) {

          sectionSelect.innerHTML =
            `<option value="">
              No sections found
            </option>`;

          tableBody.innerHTML =
            `<tr>
              <td
                colspan="5"
                class="empty">

                Firestore <b>students</b>
                collection is empty.

              </td>
            </tr>`;


          showError(
            "No student documents were found in the <b>students</b> collection."
          );

          return;

        }


        /* =========================
           GET SECTIONS
        ========================= */

        const sections =
          [
            ...new Set(

              students
                .map(
                  student =>
                    getStudentSection(student)
                )
                .filter(
                  section => section !== ""
                )

            )
          ]
          .sort();


        console.log(
          "Sections:",
          sections
        );


        /* =========================
           NO SECTION FIELD
        ========================= */

        if (sections.length === 0) {

          sectionSelect.innerHTML =
            `<option value="">
              No sections found
            </option>`;


          tableBody.innerHTML =
            `<tr>
              <td
                colspan="5"
                class="empty">

                No section field found.

              </td>
            </tr>`;


          showError(
            "Students exist, but their documents do not contain a valid <b>section</b> field."
          );


          console.table(students);

          return;

        }


        /* =========================
           ADD SECTIONS
        ========================= */

        sectionSelect.innerHTML =
          `<option value="">
            Select section
          </option>`;


        sections.forEach(
          section => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              section;

            option.textContent =
              section;

            sectionSelect.appendChild(
              option
            );

          }
        );


        /* =========================
           DEFAULT STATUS
        ========================= */

        attendanceStatus = {};


        students.forEach(
          student => {

            attendanceStatus[
              student.documentId
            ] = "P";

          }
        );


        /*
          If only one section exists,
          automatically select it.
        */

        if (sections.length === 1) {

          sectionSelect.value =
            sections[0];

          renderStudents();

        }
        else {

          tableBody.innerHTML =
            `<tr>
              <td
                colspan="5"
                class="empty">

                Select a section
                to load students.

              </td>
            </tr>`;

        }


      }
      catch (error) {

        console.error(
          "Firebase error:",
          error
        );


        showError(
          "Firebase error: <b>"
          +
          escapeHTML(
            error.message
          )
          +
          "</b>"
        );


        tableBody.innerHTML =
          `<tr>
            <td
              colspan="5"
              class="empty">

              Unable to load students.

            </td>
          </tr>`;

      }

    }


    /* ==================================================
       RENDER STUDENTS
    ================================================== */

    function renderStudents() {

      const selectedSection =
        sectionSelect.value;

      const search =
        searchInput.value
          .toLowerCase()
          .trim();


      if (!selectedSection) {

        tableBody.innerHTML =
          `<tr>
            <td
              colspan="5"
              class="empty">

              Select a section
              to load students.

            </td>
          </tr>`;

        return;

      }


      const filteredStudents =
        students.filter(
          student => {

            const studentSection =
              getStudentSection(
                student
              );

            const studentName =
              getStudentName(
                student
              );

            const studentId =
              getStudentId(
                student,
                student.documentId
              );


            const matchesSection =
              studentSection ===
              selectedSection;


            const matchesSearch =
              (
                studentName
                +
                " "
                +
                studentId
              )
              .toLowerCase()
              .includes(search);


            return (
              matchesSection
              &&
              matchesSearch
            );

          }
        );


      /* =========================
         NO STUDENTS
      ========================= */

      if (
        filteredStudents.length === 0
      ) {

        tableBody.innerHTML =
          `<tr>
            <td
              colspan="5"
              class="empty">

              No students found
              in this section.

            </td>
          </tr>`;

        return;

      }


      /* =========================
         TABLE
      ========================= */

      tableBody.innerHTML =
        filteredStudents
          .map(
            (student, index) => {

              const id =
                student.documentId;

              const studentId =
                getStudentId(
                  student,
                  id
                );

              const studentName =
                getStudentName(
                  student
                );

              const studentSection =
                getStudentSection(
                  student
                );


              const status =
                attendanceStatus[id]
                || "P";


              return `

                <tr>

                  <td>
                    ${index + 1}
                  </td>

                  <td class="student-name">
                    ${escapeHTML(
                      studentName
                    )}
                  </td>

                  <td>
                    ${escapeHTML(
                      studentId
                    )}
                  </td>

                  <td>
                    ${escapeHTML(
                      studentSection
                    )}
                  </td>

                  <td>

                    <button
                      class="status-btn present
                      ${status === "P" ? "active" : ""}"
                      onclick="setAttendance(
                        '${escapeHTML(id)}',
                        'P'
                      )">

                      P

                    </button>


                    <button
                      class="status-btn absent
                      ${status === "A" ? "active" : ""}"
                      onclick="setAttendance(
                        '${escapeHTML(id)}',
                        'A'
                      )">

                      A

                    </button>

                  </td>

                </tr>

              `;

            }
          )
          .join("");

    }


    /* ==================================================
       SET ATTENDANCE
    ================================================== */

    window.setAttendance =
      function (
        documentId,
        status
      ) {

        attendanceStatus[
          documentId
        ] = status;

        renderStudents();

      };


    /* ==================================================
       SECTION CHANGE
    ================================================== */

    sectionSelect.addEventListener(
      "change",
      function () {

        renderStudents();

      }
    );


    /* ==================================================
       SEARCH
    ================================================== */

    searchInput.addEventListener(
      "input",
      function () {

        renderStudents();

      }
    );


    /* ==================================================
       MARK ALL PRESENT
    ================================================== */

    document
      .getElementById(
        "markAllPresent"
      )
      .addEventListener(
        "click",
        function () {

          const selectedSection =
            sectionSelect.value;


          students
            .filter(
              student =>
                getStudentSection(
                  student
                )
                ===
                selectedSection
            )
            .forEach(
              student => {

                attendanceStatus[
                  student.documentId
                ] = "P";

              }
            );


          renderStudents();

          showToast(
            "All students marked Present"
          );

        }
      );


    /* ==================================================
       MARK ALL ABSENT
    ================================================== */

    document
      .getElementById(
        "markAllAbsent"
      )
      .addEventListener(
        "click",
        function () {

          const selectedSection =
            sectionSelect.value;


          students
            .filter(
              student =>
                getStudentSection(
                  student
                )
                ===
                selectedSection
            )
            .forEach(
              student => {

                attendanceStatus[
                  student.documentId
                ] = "A";

              }
            );


          renderStudents();

          showToast(
            "All students marked Absent"
          );

        }
      );


    /* ==================================================
       SAVE ATTENDANCE
    ================================================== */

    saveButton.addEventListener(
      "click",
      async function () {

        const date =
          dateInput.value;

        const section =
          sectionSelect.value;

        const subject =
          subjectInput.value.trim();

        const type =
          lectureType.value;


        /* =========================
           VALIDATION
        ========================= */

        if (!date) {

          showToast(
            "Please select date"
          );

          return;

        }


        if (!section) {

          showToast(
            "Please select section"
          );

          return;

        }


        if (!subject) {

          showToast(
            "Please enter subject"
          );

          subjectInput.focus();

          return;

        }


        const sectionStudents =
          students.filter(
            student =>
              getStudentSection(
                student
              )
              ===
              section
          );


        if (
          sectionStudents.length === 0
        ) {

          showToast(
            "No students found"
          );

          return;

        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Saving...";


        try {

          /*
            One attendance document
            per student.

            Example:

            attendance/
              STU001_2026-09-01_Math
          */


          for (
            const student
            of sectionStudents
          ) {

            const studentId =
              getStudentId(
                student,
                student.documentId
              );


            const studentName =
              getStudentName(
                student
              );


            const semester =
              getField(
                student,
                [
                  "semester",
                  "Semester",
                  "sem"
                ]
              );


            const safeSubject =
              subject
                .replace(
                  /[\/\\#?]/g,
                  "-"
                );


            const documentId =
              encodeURIComponent(
                studentId
                +
                "_"
                +
                date
                +
                "_"
                +
                safeSubject
              );


            await setDoc(

              doc(
                attendanceCollection,
                documentId
              ),

              {

                studentId:
                  studentId,

                studentDocId:
                  student.documentId,

                studentName:
                  studentName,

                section:
                  section,

                semester:
                  semester,

                date:
                  date,

                subject:
                  subject,

                lectureType:
                  type,

                status:
                  attendanceStatus[
                    student.documentId
                  ]
                  || "P",

                updatedAt:
                  serverTimestamp()

              },

              {
                merge: true
              }

            );

          }


          showSuccess(
            "Attendance saved successfully for "
            +
            sectionStudents.length
            +
            " students."
          );


          showToast(
            "Attendance saved successfully"
          );


        }
        catch (error) {

          console.error(
            "Save attendance error:",
            error
          );


          showError(
            "Unable to save attendance: <b>"
            +
            escapeHTML(
              error.message
            )
            +
            "</b>"
          );

        }
        finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "💾 Save Attendance";

        }

      }
    );


    /* ==================================================
       REFRESH
    ================================================== */

    refreshButton.addEventListener(
      "click",
      function () {

        loadStudents();

      }
    );


    /* ==================================================
       START
    ================================================== */

    loadStudents();

  </script>

</body>
</html>
