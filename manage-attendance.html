<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Manage Attendance</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#eef4ff;
color:#102653;
font-family:Arial,Helvetica,sans-serif;
}

.top{
height:85px;
background:white;
display:flex;
align-items:center;
gap:18px;
padding:15px 28px;
border-bottom:1px solid #dce5f4;
position:sticky;
top:0;
z-index:20;
}

.menu{font-size:30px}

.title{
font-size:29px;
font-weight:800;
flex:1;
}

.faculty{
color:#78869b;
font-weight:600;
}

.back,
.refresh,
.save{
border:0;
cursor:pointer;
border-radius:16px;
background:linear-gradient(100deg,#46c4e7,#2057dc);
color:white;
padding:13px 20px;
font-size:17px;
font-weight:700;
}

.wrap{
max-width:1150px;
margin:auto;
padding:25px;
}

.card{
background:white;
border-radius:28px;
padding:25px;
margin-bottom:22px;
box-shadow:0 5px 22px #dce5f2;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

.field label{
display:block;
font-weight:700;
margin-bottom:8px;
}

.field input,
.field select{
width:100%;
height:56px;
border:2px solid #d8e2f1;
border-radius:15px;
padding:0 13px;
background:#f7faff;
color:#17335e;
font-size:16px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.action{
border:0;
border-radius:13px;
padding:13px 18px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.present{
background:#e3f7ed;
color:#15945a;
}

.absent{
background:#ffe8ea;
color:#d53c45;
}

.info{
margin-top:18px;
padding:14px 17px;
border-radius:13px;
background:#edf5ff;
color:#3979c9;
}

.headrow{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.headrow h2{
flex:1;
margin:0;
}

.count{
color:#8492a7;
font-weight:600;
}

.tablewrap{
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:750px;
}

th{
background:#edf4ff;
padding:16px;
text-align:left;
}

td{
padding:14px;
border-bottom:1px solid #e3e8ef;
}

tr:hover td{
background:#fafcff;
}

.status-buttons{
display:flex;
gap:8px;
}

.status-buttons button{
width:47px;
height:39px;
border:0;
border-radius:9px;
font-weight:800;
cursor:pointer;
opacity:.35;
}

.status-buttons .p{
background:#dff5e9;
color:#1da462;
}

.status-buttons .a{
background:#ffe3e6;
color:#dd3943;
}

.status-buttons button.active{
opacity:1;
outline:2px solid currentColor;
}

.error{
background:#ffe9e9;
color:#b72f2f;
padding:15px;
border-radius:13px;
margin-bottom:18px;
}

.success{
background:#e5f8ed;
color:#168b55;
padding:15px;
border-radius:13px;
margin-bottom:18px;
}

.empty{
text-align:center;
padding:40px;
color:#8795a8;
}

@media(max-width:850px){

.grid{
grid-template-columns:1fr 1fr;
}

.faculty{
display:none;
}

}

@media(max-width:550px){

.top{
height:72px;
padding:10px 13px;
gap:8px;
}

.title{
font-size:22px;
}

.menu{
font-size:26px;
}

.back,
.refresh{
padding:10px 12px;
font-size:14px;
}

.wrap{
padding:14px;
}

.card{
padding:19px;
border-radius:23px;
}

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.field label{
font-size:14px;
}

.field input,
.field select{
height:51px;
font-size:14px;
padding:0 8px;
}

.headrow{
flex-wrap:wrap;
}

.headrow h2{
width:100%;
flex:none;
}

.save{
padding:11px 14px;
font-size:14px;
}

}

</style>
</head>


<body>

<header class="top">

<span class="menu">☰</span>

<div class="title">
Manage Attendance
</div>

<span id="facultyName" class="faculty"></span>

<button class="back" onclick="history.back()">
‹ Back
</button>

<button class="refresh" id="refresh">
↻
</button>

</header>


<main class="wrap">


<div id="error" class="error" hidden></div>

<div id="success" class="success" hidden></div>


<section class="card">


<div class="grid">


<div class="field">

<label>Date</label>

<input id="date" type="date">

</div>


<div class="field">

<label>Semester</label>

<select id="semester">

<option>Sem-1</option>
<option>Sem-2</option>
<option selected>Sem-3</option>
<option>Sem-4</option>
<option>Sem-5</option>
<option>Sem-6</option>
<option>Sem-7</option>
<option>Sem-8</option>

</select>

</div>


<div class="field">

<label>Section</label>

<select id="section">

<option>A</option>
<option>B</option>
<option>C</option>

</select>

</div>


<div class="field">

<label>Subject / Lecture</label>

<select id="subject">

<option value="">
Select subject / lecture
</option>

</select>

</div>


</div>


<div class="actions">

<button
id="allPresent"
class="action present">

✓ Mark All Present

</button>


<button
id="allAbsent"
class="action absent">

× Mark All Absent

</button>

</div>


<div class="info">

Select date, semester, section and lecture,
then mark <b>P</b> or <b>A</b>.

</div>


</section>


<section class="card">


<div class="headrow">

<h2>Students</h2>

<span id="count" class="count">
0 students
</span>

<button id="save" class="save">
Save Attendance
</button>

</div>


<div class="tablewrap">

<table>

<thead>

<tr>
<th>#</th>
<th>Roll No.</th>
<th>Student Name</th>
<th>Section</th>
<th>Attendance</th>
</tr>

</thead>


<tbody id="students">

<tr>

<td colspan="5" class="empty">
Loading students...
</td>

</tr>

</tbody>

</table>

</div>

</section>

</main>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
doc,
getDocs,
query,
where,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:"AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

authDomain:"university-portal-2107e.firebaseapp.com",

projectId:"university-portal-2107e",

storageBucket:"university-portal-2107e.firebasestorage.app",

messagingSenderId:"50848903813",

appId:"1:50848903813:web:8296090d0d9268cfd2efec",

measurementId:"G-LKTX7C7F0E"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* =====================================================
   HELPERS
===================================================== */

const $=id=>
document.getElementById(id);


function today(){

const d=new Date();

return new Date(
d.getTime()-
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function getUser(){

try{

return JSON.parse(

localStorage.getItem("universityUser") ||

localStorage.getItem("currentUser") ||

localStorage.getItem("user") ||

"null"

);

}catch{

return null;

}

}


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function attendanceId(
studentId,
date,
subjectId
){

return (

studentId+
"_"+date+
"_"+subjectId

)
.replace(/[\/\s#?[\]]/g,"_");

}


/* =====================================================
   VARIABLES
===================================================== */

const currentUser=getUser();

let students=[];

let subjects=[];

let existing=[];

let selectedSubject=null;


/* =====================================================
   SUBJECTS
===================================================== */

async function loadSubjects(){

const q=query(

collection(db,"subjects"),

where(
"section",
"==",
$("section").value
),

where(
"semester",
"==",
$("semester").value
)

);


const snap=
await getDocs(q);


subjects=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


$("subject").innerHTML=`

<option value="">
Select subject / lecture
</option>

`;


subjects.forEach(s=>{

const option=
document.createElement("option");

option.value=s.id;

option.textContent=
`${s.code||""} — ${s.name||""}`;

$("subject")
.appendChild(option);

});


selectedSubject=null;

}


/* =====================================================
   STUDENTS
===================================================== */

async function loadStudents(){

const q=query(

collection(db,"students"),

where(
"section",
"==",
$("section").value
),

where(
"semester",
"==",
$("semester").value
)

);


const snap=
await getDocs(q);


students=
snap.docs
.map(d=>({

id:d.id,
...d.data()

}))
.filter(s=>s.active!==false)
.sort((a,b)=>

String(a.rollNo||"")
.localeCompare(
String(b.rollNo||""),
undefined,
{numeric:true}
)

);


await loadExisting();

renderStudents();

}


/* =====================================================
   EXISTING ATTENDANCE
===================================================== */

async function loadExisting(){

const q=query(

collection(db,"attendance"),

where(
"date",
"==",
$("date").value
),

where(
"section",
"==",
$("section").value
),

where(
"semester",
"==",
$("semester").value
)

);


const snap=
await getDocs(q);


existing=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));

}


/* =====================================================
   STATUS
===================================================== */

function statusFor(studentId){

if(!selectedSubject)
return "";

const record=
existing.find(x=>

x.studentId===studentId &&
x.subjectId===selectedSubject.id

);

return record?.status||"";

}


/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents(){

if(!students.length){

$("students").innerHTML=`

<tr>

<td colspan="5" class="empty">
No students found.
</td>

</tr>

`;

$("count").textContent=
"0 students";

return;

}


$("students").innerHTML=

students.map((s,i)=>{

const status=
statusFor(s.id);

return `

<tr data-id="${esc(s.id)}">

<td>
${i+1}
</td>

<td>
<b>${esc(s.rollNo||"—")}</b>
</td>

<td>
${esc(s.name||"Unnamed")}
</td>

<td>
${esc(s.section||"—")}
</td>

<td>

<div class="status-buttons">

<button
class="p ${
status==="P"?"active":""
}"
data-status="P">
P
</button>

<button
class="a ${
status==="A"?"active":""
}"
data-status="A">
A
</button>

</div>

</td>

</tr>

`;

}).join("");


$("count").textContent=
students.length+" students";


document
.querySelectorAll(
"#students [data-status]"
)
.forEach(button=>{

button.onclick=()=>{

const row=
button.closest("tr");


row
.querySelectorAll(
"[data-status]"
)
.forEach(b=>
b.classList.remove("active")
);


button.classList.add("active");


row.dataset.status=
button.dataset.status;

};

});

}


/* =====================================================
   RELOAD
===================================================== */

async function reload(){

try{

$("error").hidden=true;

await loadSubjects();

await loadStudents();

}catch(e){

console.error(e);

$("error").textContent=
e.message;

$("error").hidden=false;

}

}


/* =====================================================
   SUBJECT CHANGE
===================================================== */

$("subject").onchange=()=>{

selectedSubject=
subjects.find(
s=>s.id===$("subject").value
)||null;

renderStudents();

};


/* =====================================================
   SECTION
===================================================== */

$("section").onchange=reload;


/* =====================================================
   SEMESTER
===================================================== */

$("semester").onchange=reload;


/* =====================================================
   DATE
===================================================== */

$("date").onchange=async()=>{

try{

await loadExisting();

renderStudents();

}catch(e){

$("error").textContent=
e.message;

$("error").hidden=false;

}

};


/* =====================================================
   ALL PRESENT
===================================================== */

$("allPresent").onclick=()=>{

if(!selectedSubject){

alert("Please select Subject / Lecture.");

return;

}


document
.querySelectorAll(
"#students tr[data-id]"
)
.forEach(row=>{

row.dataset.status="P";


row
.querySelector(
'[data-status="P"]'
)
.classList.add("active");


row
.querySelector(
'[data-status="A"]'
)
.classList.remove("active");

});

};


/* =====================================================
   ALL ABSENT
===================================================== */

$("allAbsent").onclick=()=>{

if(!selectedSubject){

alert("Please select Subject / Lecture.");

return;

}


document
.querySelectorAll(
"#students tr[data-id]"
)
.forEach(row=>{

row.dataset.status="A";


row
.querySelector(
'[data-status="A"]'
)
.classList.add("active");


row
.querySelector(
'[data-status="P"]'
)
.classList.remove("active");

});

};


/* =====================================================
   SAVE ATTENDANCE
===================================================== */

$("save").onclick=async()=>{

try{

$("error").hidden=true;

$("success").hidden=true;


if(!selectedSubject){

alert(
"Please select Subject / Lecture."
);

return;

}


const rows=[

...document.querySelectorAll(
"#students tr[data-id]"
)

];


const marked=
rows.filter(row=>

row.dataset.status==="P" ||
row.dataset.status==="A"

);


if(!marked.length){

alert(
"Please mark P or A for students."
);

return;

}


$("save").disabled=true;


let saved=0;


for(const row of marked){

const student=
students.find(
s=>s.id===row.dataset.id
);


const id=
attendanceId(

student.id,

$("date").value,

selectedSubject.id

);


await setDoc(

doc(
db,
"attendance",
id
),

{

studentId:
student.id,

date:
$("date").value,

section:
student.section ||
$("section").value,

semester:
student.semester ||
$("semester").value,

subjectId:
selectedSubject.id,

subjectCode:
selectedSubject.code||"",

subjectName:
selectedSubject.name||"",

lectureType:
selectedSubject.lectureType ||
"Theory",

status:
row.dataset.status,

markedBy:
currentUser?.uid ||
currentUser?.id ||
currentUser?.username ||
"faculty",

updatedAt:
serverTimestamp()

},

{merge:true}

);


saved++;

}


/*
 * IMPORTANT:
 * createdAt केवल नया record होने पर
 * अलग से जरूरत हो तो Firestore server timestamp
 * merge के साथ updateAt भी रहेगा.
 */


await loadExisting();

renderStudents();


$("success").textContent=
`✓ Attendance saved successfully for ${saved} students.`;

$("success").hidden=false;


}catch(e){

console.error(e);

$("error").textContent=
e.message||
"Unable to save attendance.";

$("error").hidden=false;

}finally{

$("save").disabled=false;

}

};


/* =====================================================
   REFRESH
===================================================== */

$("refresh").onclick=reload;


/* =====================================================
   INIT
===================================================== */

async function init(){

if(!currentUser){

$("error").textContent=
"Please login first.";

$("error").hidden=false;

return;

}


$("facultyName").textContent=
currentUser.name ||
currentUser.username ||
"Faculty";


$("date").value=today();


await reload();

}


init();

</script>

</body>
</html>
