<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Attendance - Sunrise Public School</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #007BFF;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .navbar h1 {
            margin: 0;
            font-size: 18px;
            max-width: 35%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .logout:hover {
            background: #c82333;
        }

        /* ================= MENU ================= */

        .menu-bar {
            background: #0056b3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 30px;
            flex-wrap: wrap;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .menu-bar a:hover {
            color: #FFD700;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 94%;
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007BFF;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* ================= CONTROL PANEL ================= */

        .control-panel {
            background: #e9f3ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .control-row {
            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 220px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        .load-btn {
            background: #007BFF;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .load-btn:hover {
            background: #0056b3;
        }

        /* ================= SUMMARY ================= */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-box {
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            background: #f5f5f5;
            border: 1px solid #eee;
        }

        .summary-box h3 {
            margin: 0 0 8px;
            font-size: 15px;
            color: #555;
        }

        .summary-box strong {
            font-size: 25px;
            color: #007BFF;
        }

        #presentCount {
            color: #28a745;
        }

        #absentCount {
            color: #dc3545;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007BFF;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        /* ================= STATUS SELECT ================= */

        .status-select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-weight: bold;
            cursor: pointer;
            min-width: 120px;
        }

        .status-select.present-status {
            color: #198754;
            background: #d1e7dd;
            border-color: #198754;
        }

        .status-select.absent-status {
            color: #dc3545;
            background: #f8d7da;
            border-color: #dc3545;
        }

        .status-select.not-marked-status {
            color: #555;
            background: #f5f5f5;
        }

        /* ================= SAVE ================= */

        .save-area {
            text-align: center;
            margin-top: 25px;
        }

        .save-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .save-btn:hover {
            background: #218838;
        }

        .save-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* ================= LOADING ================= */

        #loading {
            text-align: center;
            color: #555;
            padding: 20px;
            display: none;
        }

        /* ================= MESSAGE ================= */

        #message {
            display: none;
            text-align: center;
            padding: 14px;
            margin-top: 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .error {
            display: block !important;
            background: #f8d7da;
            color: #721c24;
        }

        .success {
            display: block !important;
            background: #d4edda;
            color: #155724;
        }

        .info {
            display: block !important;
            background: #cfe2ff;
            color: #084298;
        }

        /* ================= EMPTY ================= */

        #emptyMessage {
            display: none;
            text-align: center;
            padding: 25px;
            color: #666;
        }

        /* ================= BACK ================= */

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 12px;
            }

            .navbar h1 {
                font-size: 12px;
                max-width: 32%;
            }

            .center-title {
                font-size: 18px;
            }

            .logout {
                padding: 7px 10px;
                font-size: 12px;
            }

            .menu-bar {
                flex-direction: column;
                gap: 10px;
            }

            .container {
                width: 95%;
                margin: 20px auto;
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            .control-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-group {
                min-width: 100%;
            }

            .load-btn {
                width: 100%;
            }
        }

        @media (max-width: 450px) {

            .summary {
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <h1 id="welcome">
            Welcome 👋
        </h1>

        <div class="center-title">
            Manage Attendance
        </div>

        <button
            id="logoutBtn"
            class="logout"
            type="button">

            Logout

        </button>

    </div>


    <!-- ================= MENU ================= -->

    <div class="menu-bar">

        <a href="faculty-dashboard.html">Dashboard</a>

        <a href="manage-school.html">Manage School</a>

        <a href="manage-services.html">Manage Services</a>

        <a href="manage-attendance.html">Attendance</a>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="container">

        <h2>
            📊 Manage Student Attendance
        </h2>


        <!-- ================= CONTROL PANEL ================= -->

        <div class="control-panel">

            <div class="control-row">

                <div class="form-group">

                    <label for="attendanceDate">
                        Select Date
                    </label>

                    <input
                        type="date"
                        id="attendanceDate">

                </div>


                <button
                    type="button"
                    id="loadStudentsBtn"
                    class="load-btn">

                    Load Students

                </button>

            </div>

        </div>


        <!-- ================= SUMMARY ================= -->

        <div class="summary">

            <div class="summary-box">

                <h3>
                    Total Students
                </h3>

                <strong id="totalStudents">
                    0
                </strong>

            </div>


            <div class="summary-box">

                <h3>
                    Present
                </h3>

                <strong id="presentCount">
                    0
                </strong>

            </div>


            <div class="summary-box">

                <h3>
                    Absent
                </h3>

                <strong id="absentCount">
                    0
                </strong>

            </div>


            <div class="summary-box">

                <h3>
                    Attendance %
                </h3>

                <strong id="attendancePercentage">
                    0%
                </strong>

            </div>

        </div>


        <!-- ================= LOADING ================= -->

        <div id="loading">
            Loading students...
        </div>


        <!-- ================= EMPTY ================= -->

        <div id="emptyMessage">
            No students found.
        </div>


        <!-- ================= TABLE ================= -->

        <div
            class="table-wrapper"
            id="tableContainer"
            style="display:none;">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Roll No
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Attendance
                        </th>

                    </tr>

                </thead>


                <tbody id="studentsBody">
                </tbody>

            </table>

        </div>


        <!-- ================= SAVE ================= -->

        <div
            class="save-area"
            id="saveArea"
            style="display:none;">

            <button
                type="button"
                id="saveAttendanceBtn"
                class="save-btn">

                💾 Save Attendance

            </button>

        </div>


        <!-- ================= MESSAGE ================= -->

        <div id="message"></div>


        <!-- ================= BACK ================= -->

        <a
            href="faculty-dashboard.html"
            class="back-btn">

            ⬅ Back to Faculty Dashboard

        </a>

    </div>


    <!-- ================= FIREBASE ================= -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            query,
            where,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* =========================================
           FIREBASE CONFIG
        ========================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"

        };


        /* =========================================
           INITIALIZE FIREBASE
        ========================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        /* =========================================
           ELEMENTS
        ========================================= */

        const welcome =
            document.getElementById("welcome");

        const attendanceDate =
            document.getElementById("attendanceDate");

        const loadStudentsBtn =
            document.getElementById("loadStudentsBtn");

        const saveAttendanceBtn =
            document.getElementById("saveAttendanceBtn");

        const saveArea =
            document.getElementById("saveArea");

        const loading =
            document.getElementById("loading");

        const tableContainer =
            document.getElementById("tableContainer");

        const studentsBody =
            document.getElementById("studentsBody");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const message =
            document.getElementById("message");

        const logoutBtn =
            document.getElementById("logoutBtn");

        const totalStudents =
            document.getElementById("totalStudents");

        const presentCount =
            document.getElementById("presentCount");

        const absentCount =
            document.getElementById("absentCount");

        const attendancePercentage =
            document.getElementById("attendancePercentage");


        /* =========================================
           GLOBAL DATA
        ========================================= */

        let currentFaculty = null;

        let students = [];

        let currentAttendanceDocId = null;


        /* =========================================
           DEFAULT DATE
        ========================================= */

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");

        attendanceDate.value =
            `${year}-${month}-${day}`;


        /* =========================================
           AUTH CHECK
        ========================================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;
                }


                currentFaculty = user;


                welcome.textContent =
                    "Welcome, " +
                    (user.email || "Faculty") +
                    " 👋";

            }
        );


        /* =========================================
           LOAD STUDENTS
        ========================================= */

        loadStudentsBtn.addEventListener(
            "click",
            async () => {

                const date =
                    attendanceDate.value;

                if (!date) {

                    showMessage(
                        "Please select attendance date.",
                        "error"
                    );

                    return;
                }


                await loadStudents(date);

            }
        );


        async function loadStudents(date) {

            try {

                hideMessage();

                loading.style.display =
                    "block";

                tableContainer.style.display =
                    "none";

                saveArea.style.display =
                    "none";

                emptyMessage.style.display =
                    "none";

                studentsBody.innerHTML =
                    "";

                resetSummary();


                /* =================================
                   GET STUDENTS
                ================================= */

                const studentsSnapshot =
                    await getDocs(
                        collection(
                            db,
                            "students"
                        )
                    );


                students = [];


                studentsSnapshot.forEach(
                    (studentDoc) => {

                        const data =
                            studentDoc.data();


                        /*
                         IMPORTANT:
                         The Firestore document ID
                         must be the Firebase Auth UID.
                        */

                        const uid =
                            studentDoc.id;


                        students.push({

                            uid: uid,

                            name:
                                data.name ||
                                data.fullName ||
                                "Student",

                            rollNo:
                                data.rollNo ??
                                data.rollNumber ??
                                "",

                            email:
                                data.email ||
                                ""

                        });

                    }
                );


                /*
                   Sort by roll number
                */

                students.sort(
                    (a, b) => {

                        return String(
                            a.rollNo
                        ).localeCompare(
                            String(
                                b.rollNo
                            ),
                            undefined,
                            {
                                numeric: true
                            }
                        );

                    }
                );


                /* =================================
                   GET EXISTING ATTENDANCE
                ================================= */

                const attendanceQuery =
                    query(
                        collection(
                            db,
                            "attendance"
                        ),
                        where(
                            "date",
                            "==",
                            date
                        )
                    );


                const attendanceSnapshot =
                    await getDocs(
                        attendanceQuery
                    );


                currentAttendanceDocId =
                    null;


                let existingStudents =
                    {};


                attendanceSnapshot.forEach(
                    (attendanceDoc) => {

                        const data =
                            attendanceDoc.data();


                        /*
                           If a record already exists
                           for this date, use it.
                        */

                        if (
                            !currentAttendanceDocId &&
                            data.students
                        ) {

                            currentAttendanceDocId =
                                attendanceDoc.id;

                            existingStudents =
                                data.students;

                        }

                    }
                );


                /* =================================
                   APPLY EXISTING STATUS
                ================================= */

                students =
                    students.map(
                        (student) => {

                            const oldRecord =
                                existingStudents[
                                    student.uid
                                ];


                            return {

                                ...student,

                                status:
                                    oldRecord &&
                                    oldRecord.status
                                    ? oldRecord.status
                                    : "Not Marked"

                            };

                        }
                    );


                loading.style.display =
                    "none";


                if (
                    students.length === 0
                ) {

                    emptyMessage.style.display =
                        "block";

                    return;
                }


                renderStudents();

                tableContainer.style.display =
                    "block";

                saveArea.style.display =
                    "block";

                updateSummary();

            }

            catch (error) {

                console.error(
                    "Load Students Error:",
                    error
                );

                loading.style.display =
                    "none";

                showMessage(
                    "❌ Students load nahi ho paaye. Firestore structure check karein.",
                    "error"
                );

            }

        }


        /* =========================================
           RENDER STUDENTS
        ========================================= */

        function renderStudents() {

            studentsBody.innerHTML =
                "";


            students.forEach(
                (student, index) => {

                    const row =
                        document.createElement("tr");


                    const numberCell =
                        document.createElement("td");

                    numberCell.textContent =
                        index + 1;


                    const rollCell =
                        document.createElement("td");

                    rollCell.textContent =
                        student.rollNo ||
                        "-";


                    const nameCell =
                        document.createElement("td");

                    nameCell.textContent =
                        student.name;


                    const emailCell =
                        document.createElement("td");

                    emailCell.textContent =
                        student.email ||
                        "-";


                    const statusCell =
                        document.createElement("td");


                    const select =
                        document.createElement("select");

                    select.className =
                        "status-select";


                    const options = [

                        "Not Marked",
                        "Present",
                        "Absent"

                    ];


                    options.forEach(
                        (status) => {

                            const option =
                                document.createElement(
                                    "option"
                                );

                            option.value =
                                status;

                            option.textContent =
                                status;


                            if (
                                student.status ===
                                status
                            ) {

                                option.selected =
                                    true;

                            }


                            select.appendChild(
                                option
                            );

                        }
                    );


                    updateSelectStyle(
                        select
                    );


                    select.addEventListener(
                        "change",
                        () => {

                            student.status =
                                select.value;

                            updateSelectStyle(
                                select
                            );

                            updateSummary();

                        }
                    );


                    statusCell.appendChild(
                        select
                    );


                    row.appendChild(
                        numberCell
                    );

                    row.appendChild(
                        rollCell
                    );

                    row.appendChild(
                        nameCell
                    );

                    row.appendChild(
                        emailCell
                    );

                    row.appendChild(
                        statusCell
                    );


                    studentsBody.appendChild(
                        row
                    );

                }
            );

        }


        /* =========================================
           SELECT STYLE
        ========================================= */

        function updateSelectStyle(
            select
        ) {

            select.classList.remove(
                "present-status",
                "absent-status",
                "not-marked-status"
            );


            if (
                select.value ===
                "Present"
            ) {

                select.classList.add(
                    "present-status"
                );

            }

            else if (
                select.value ===
                "Absent"
            ) {

                select.classList.add(
                    "absent-status"
                );

            }

            else {

                select.classList.add(
                    "not-marked-status"
                );

            }

        }


        /* =========================================
           SUMMARY
        ========================================= */

        function updateSummary() {

            const total =
                students.length;


            const present =
                students.filter(
                    student =>
                        student.status ===
                        "Present"
                ).length;


            const absent =
                students.filter(
                    student =>
                        student.status ===
                        "Absent"
                ).length;


            const percentage =
                total > 0
                    ? (
                        present /
                        total *
                        100
                    ).toFixed(1)
                    : "0.0";


            totalStudents.textContent =
                total;

            presentCount.textContent =
                present;

            absentCount.textContent =
                absent;

            attendancePercentage.textContent =
                percentage + "%";

        }


        function resetSummary() {

            totalStudents.textContent =
                "0";

            presentCount.textContent =
                "0";

            absentCount.textContent =
                "0";

            attendancePercentage.textContent =
                "0%";

        }


        /* =========================================
           SAVE ATTENDANCE
        ========================================= */

        saveAttendanceBtn.addEventListener(
            "click",
            async () => {

                if (!currentFaculty) {

                    showMessage(
                        "Faculty login required.",
                        "error"
                    );

                    return;
                }


                const date =
                    attendanceDate.value;


                if (!date) {

                    showMessage(
                        "Please select a date.",
                        "error"
                    );

                    return;
                }


                if (
                    students.length === 0
                ) {

                    showMessage(
                        "No students available.",
                        "error"
                    );

                    return;
                }


                /*
                   Do not allow incomplete attendance.
                */

                const notMarked =
                    students.filter(
                        student =>
                            student.status ===
                            "Not Marked"
                    );


                if (
                    notMarked.length > 0
                ) {

                    showMessage(
                        `${notMarked.length} student(s) ki attendance mark nahi hui hai.`,
                        "error"
                    );

                    return;
                }


                try {

                    saveAttendanceBtn.disabled =
                        true;

                    saveAttendanceBtn.textContent =
                        "Saving...";


                    /* =================================
                       STUDENTS MAP
                    ================================= */

                    const studentsMap =
                        {};


                    students.forEach(
                        (student) => {

                            /*
                               Key = actual Firebase
                               Authentication UID
                            */

                            studentsMap[
                                student.uid
                            ] = {

                                rollNo:
                                    student.rollNo,

                                name:
                                    student.name,

                                status:
                                    student.status

                            };

                        }
                    );


                    /* =================================
                       CREATE / UPDATE DOCUMENT
                    ================================= */

                    let attendanceRef;


                    if (
                        currentAttendanceDocId
                    ) {

                        attendanceRef =
                            doc(
                                db,
                                "attendance",
                                currentAttendanceDocId
                            );

                    }

                    else {

                        attendanceRef =
                            doc(
                                collection(
                                    db,
                                    "attendance"
                                )
                            );

                        currentAttendanceDocId =
                            attendanceRef.id;

                    }


                    await setDoc(
                        attendanceRef,
                        {

                            date:
                                date,

                            facultyId:
                                currentFaculty.uid,

                            createdAt:
                                serverTimestamp(),

                            students:
                                studentsMap

                        },
                        {
                            merge: true
                        }
                    );


                    showMessage(
                        "✅ Attendance successfully saved!",
                        "success"
                    );


                    saveAttendanceBtn.textContent =
                        "✓ Attendance Saved";


                    setTimeout(
                        () => {

                            saveAttendanceBtn.textContent =
                                "💾 Save Attendance";

                            saveAttendanceBtn.disabled =
                                false;

                        },
                        1500
                    );

                }

                catch (error) {

                    console.error(
                        "Save Attendance Error:",
                        error
                    );


                    showMessage(
                        "❌ Attendance save nahi ho paayi: " +
                        error.message,
                        "error"
                    );


                    saveAttendanceBtn.disabled =
                        false;

                    saveAttendanceBtn.textContent =
                        "💾 Save Attendance";

                }

            }
        );


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;

            message.style.display =
                "block";

        }


        function hideMessage() {

            message.textContent =
                "";

            message.className =
                "";

            message.style.display =
                "none";

        }


        /* =========================================
           LOGOUT
        ========================================= */

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Logout Error:",
                        error
                    );

                    alert(
                        "Logout failed. Please try again."
                    );

                }

            }
        );

    </script>

</body>

</html>
