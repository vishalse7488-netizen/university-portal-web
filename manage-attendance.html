<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Manage Attendance</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#eef4ff;
    color:#102653;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.topbar{

    height:84px;

    background:#ffffff;

    display:flex;

    align-items:center;

    gap:18px;

    padding:
        14px
        28px;

    border-bottom:
        1px solid
        #dce5f4;

    position:sticky;

    top:0;

    z-index:100;

}


.menu-btn{

    border:0;

    background:transparent;

    color:#102653;

    font-size:31px;

    cursor:pointer;

    padding:4px;

}


.page-title{

    flex:1;

    font-size:29px;

    font-weight:800;

    color:#102653;

}


.top-btn{

    border:0;

    border-radius:16px;

    min-height:50px;

    padding:
        0 20px;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    color:#ffffff;

    background:
        linear-gradient(
            100deg,
            #46c4e7,
            #2057dc
        );

}


.refresh-btn{

    width:52px;

    padding:0;

    font-size:26px;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:1180px;

    margin:0 auto;

    padding:28px;

}


/* =====================================================
   CARDS
===================================================== */

.card{

    background:#ffffff;

    border-radius:28px;

    padding:25px;

    margin-bottom:23px;

    box-shadow:
        0 6px 24px
        rgba(
            44,
            83,
            145,
            .10
        );

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    padding:15px 18px;

    border-radius:14px;

    margin-bottom:18px;

    font-size:15px;

    line-height:1.5;

}


.error{

    background:#ffe8e8;

    color:#b92e38;

    border:
        1px solid
        #f3b9bd;

}


.success{

    background:#e6f8ee;

    color:#168b55;

    border:
        1px solid
        #bfe6d1;

}


.hidden{

    display:none !important;

}


/* =====================================================
   FORM GRID
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:17px;

}


.form-group{

    min-width:0;

}


.form-group label{

    display:block;

    margin-bottom:9px;

    font-size:15px;

    font-weight:700;

    color:#102653;

}


.form-control{

    width:100%;

    height:56px;

    padding:
        0 14px;

    border:
        2px solid
        #d8e3f3;

    border-radius:15px;

    background:#f7faff;

    color:#18345e;

    font-size:16px;

    outline:none;

    transition:.2s;

}


.form-control:focus{

    border-color:#5da1ed;

    background:#ffffff;

    box-shadow:
        0 0 0 3px
        rgba(
            64,
            143,
            229,
            .10
        );

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:11px;

    margin-top:20px;

}


.action-btn{

    border:0;

    border-radius:13px;

    padding:
        13px
        19px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


.present-btn{

    background:#e1f7eb;

    color:#14945a;

}


.absent-btn{

    background:#ffe6e9;

    color:#d43b46;

}


.action-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   INFO
===================================================== */

.info-box{

    margin-top:18px;

    padding:
        14px
        17px;

    border-radius:14px;

    background:#edf5ff;

    color:#3979c9;

    line-height:1.5;

}


/* =====================================================
   STUDENT HEADER
===================================================== */

.student-header{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

}


.student-header h2{

    margin:0;

    flex:1;

    font-size:25px;

}


.student-count{

    color:#8492a7;

    font-weight:700;

}


.save-btn{

    border:0;

    border-radius:16px;

    padding:
        13px
        21px;

    background:
        linear-gradient(
            100deg,
            #46c4e7,
            #2057dc
        );

    color:#ffffff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


.save-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    min-width:760px;

    border-collapse:collapse;

}


thead th{

    background:#edf4ff;

    color:#102653;

    text-align:left;

    padding:
        16px
        15px;

    font-size:15px;

    font-weight:800;

}


tbody td{

    padding:
        14px
        15px;

    border-bottom:
        1px solid
        #e4e9f1;

    font-size:15px;

}


tbody tr:hover td{

    background:#fafcff;

}


/* =====================================================
   STATUS BUTTONS
===================================================== */

.status-buttons{

    display:flex;

    align-items:center;

    gap:8px;

}


.status-btn{

    width:47px;

    height:39px;

    border:0;

    border-radius:9px;

    cursor:pointer;

    font-size:15px;

    font-weight:800;

    opacity:.35;

    transition:.15s;

}


.status-btn.present{

    background:#dff5e9;

    color:#15995a;

}


.status-btn.absent{

    background:#ffe3e6;

    color:#db3945;

}


.status-btn.active{

    opacity:1;

    transform:scale(1.03);

    box-shadow:
        0 0 0 2px
        currentColor;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    text-align:center;

    padding:
        45px
        20px;

    color:#8492a7;

}


.empty-icon{

    font-size:46px;

    margin-bottom:10px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:35px;

    color:#5d6f8b;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .form-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

    }

}


@media(max-width:600px){

    .topbar{

        height:72px;

        padding:
            10px
            13px;

        gap:9px;

    }


    .menu-btn{

        font-size:27px;

    }


    .page-title{

        font-size:22px;

    }


    .top-btn{

        min-height:44px;

        padding:
            0 12px;

        border-radius:13px;

        font-size:14px;

    }


    .refresh-btn{

        width:45px;

        font-size:24px;

    }


    .container{

        padding:14px;

    }


    .card{

        padding:19px;

        border-radius:23px;

        margin-bottom:16px;

    }


    .form-grid{

        grid-template-columns:
            1fr
            1fr;

        gap:11px;

    }


    .form-group label{

        font-size:13px;

    }


    .form-control{

        height:51px;

        font-size:14px;

        padding:
            0 9px;

    }


    .student-header{

        flex-wrap:wrap;

    }


    .student-header h2{

        flex-basis:100%;

        font-size:22px;

    }


    .student-count{

        flex:1;

    }


    .save-btn{

        padding:
            11px
            14px;

        font-size:14px;

    }


    .action-btn{

        padding:
            11px
            13px;

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">

    <button
        class="menu-btn"
        type="button"
        aria-label="Menu"
        onclick="history.back()"
    >
        ☰
    </button>


    <div class="page-title">
        Manage Attendance
    </div>


    <button
        class="top-btn"
        type="button"
        onclick="history.back()"
    >
        ‹ Back
    </button>


    <button
        id="refreshBtn"
        class="top-btn refresh-btn"
        type="button"
        title="Refresh"
    >
        ↻
    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="message error hidden"
    ></div>


    <!-- SUCCESS -->

    <div
        id="successMessage"
        class="message success hidden"
    ></div>



    <!-- =================================================
         FILTER CARD
    ================================================== -->

    <section class="card">


        <div class="form-grid">


            <!-- DATE -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input

                    class="form-control"

            </div>



            <!-- SEMESTER -->

            <div class="form-group">

                <label for="semester">
                    Semester
                </label>

                <select
                    id="semester"
                    class="form-control"
                >

                    <option value="Sem-1">
                        Sem-1
                    </option>

                    <option value="Sem-2">
                        Sem-2
                    </option>

                    <option
                        value="Sem-3"
                        selected
                    >
                        Sem-3
                    </option>

                    <option value="Sem-4">
                        Sem-4
                    </option>

                    <option value="Sem-5">
                        Sem-5
                    </option>

                    <option value="Sem-6">
                        Sem-6
                    </option>

                    <option value="Sem-7">
                        Sem-7
                    </option>

                    <option value="Sem-8">
                        Sem-8
                    </option>

                </select>

            </div>



            <!-- SECTION -->

            <div class="form-group">

                <label for="section">
                    Section

                <select
                    id="section"
                    class="form-control"
                >

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C

                </select>

            </div>



            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject / Lecture
                </label>

                <select
                    id="subject"
                    class="form-control"
                >

                    <option value="">
                        Loading subjects...
                    </option>

                </select>

            </div>


        </div>



        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="allPresent"
                class="action-btn present-btn"
                type="button"
            >
                ✓ Mark All Present
            </button>


            <button
                id="allAbsent"
                class="action-btn absent-btn"
                type="button"
            >
                × Mark All Absent
            </button>

        </div>



        <div class="info-box">

            Select date, semester, section and lecture,
            then mark <b>P</b> or <b>A</b>.

        </div>


    </section>



    <!-- =================================================
         STUDENTS CARD
    ================================================== -->

    <section class="card">


        <div class="student-header">

            <h2>
                Students
            </h2>


            <span
                id="studentCount"
                class="student-count"
            >
                0 students
            </span>


            <button
                id="saveAttendance"
                class="save-btn"
                type="button"
            >
                Save Attendance
            </button>

        </div>



        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Roll No.
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Section
                        </th>

                        <th>
                            Attendance
                        </th>

                    </tr>

                </thead>



                <tbody id="studentTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="loading"
                        >
                            Loading students...
                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </section>


</main>



<!-- =====================================================

===================================================== -->

<script type="module">


/* =====================================================

===================================================== */

}
from

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    messagingSenderId:

    measurementId:

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);



/* =====================================================
   DOM HELPERS
===================================================== */

const $ = (id) =>
    document.getElementById(id);



/* =====================================================
   GLOBAL DATA
===================================================== */

let allStudents = [];

let allSubjects = [];

let attendanceRecords = [];

let selectedSubject = null;



/* =====================================================
   CURRENT USER
===================================================== */

function getCurrentUser(){

    try{

        return JSON.parse(

            localStorage.getItem(
                "universityUser"
            )

            ||

            localStorage.getItem(
                "currentUser"
            )

            ||

            localStorage.getItem(
                "user"
            )

            ||

            "null"

        );

    }

    catch(error){

        return null;

    }

}


const currentUser =
    getCurrentUser();



/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase();

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[character];

        }
    );

}



/* =====================================================
   TODAY
===================================================== */

function getToday(){

    const now =
        new Date();


    return new Date(

        now.getTime()

        -

        now.getTimezoneOffset()
        * 60000

    )
    .toISOString()
    .slice(
        0,
        10
    );

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    $("errorMessage")
        .textContent =
            message;

    $("errorMessage")
        .classList
        .remove("hidden");

}


function hideError(){

    $("errorMessage")
        .classList
        .add("hidden");

}



/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess(message){

    $("successMessage")
        .textContent =
            message;

    $("successMessage")
        .classList
        .remove("hidden");


    setTimeout(

        function(){

            $("successMessage")
                .classList
                .add("hidden");

        },

        5000

    );

}



/* =====================================================
   LOAD ALL STUDENTS
===================================================== */

async function loadAllStudents(){

    try{

        console.log(
            "Loading students..."
        );


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "students"
                )

            );


        allStudents =
            snapshot.docs.map(

                function(document){

                    return {

                        id:
                            document.id,

                        ...document.data()

                    };

                }

            );


        console.log(
            "Students loaded:",
            allStudents.length
        );


        filterAndRenderStudents();


    }

    catch(error){

        console.error(
            "Students error:",
            error
        );


        showError(
            "Students load nahi ho rahe: " +
            error.message
        );


        renderEmptyStudents(
            "Students load nahi ho paaye."
        );

    }

}



/* =====================================================
   FILTER STUDENTS
===================================================== */

function getFilteredStudents(){

    const selectedSection =
        normalize(
            $("section").value
        );


    const selectedSemester =
        normalize(
            $("semester").value
        );


    return allStudents
        .filter(

            function(student){

                /*
                 * active false ko hide karo
                 */

                if(
                    student.active === false
                ){

                    return false;

                }


                const section =
                    normalize(
                        student.section
                    );


                const semester =
                    normalize(
                        student.semester
                    );


                /*
                 * Section match
                 */

                if(
                    selectedSection
                    &&
                    section !==
                        selectedSection
                ){

                    return false;

                }


                /*
                 * Semester match
                 */

                if(
                    selectedSemester
                    &&
                    semester !==
                        selectedSemester
                ){

                    return false;

                }


                return true;

            }

        )
        .sort(

            function(a,b){

                return String(
                    a.rollNo ||
                    a.roll ||
                    ""
                )
                .localeCompare(

                    String(
                        b.rollNo ||
                        b.roll ||
                        ""
                    ),

                    undefined,

                    {
                        numeric:true
                    }

                );

            }

        );

}



/* =====================================================
   FILTER AND RENDER
===================================================== */

function filterAndRenderStudents(){

    const filtered =
        getFilteredStudents();


    renderStudents(
        filtered
    );

}



/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents(students){

    const tbody =
        $("studentTableBody");


    if(
        !students.length
    ){

        renderEmptyStudents(

            "No students found for " +

            $("section").value +

            " / " +

            $("semester").value

        );

        return;

    }


    $("studentCount")
        .textContent =
            students.length +
            " students";


    tbody.innerHTML =


        students.map(

            function(student,index){

                const status =
                    getExistingStatus(
                        student.id
                    );


                return `

                    <tr
                        data-student-id="${escapeHtml(
                            student.id
                        )}"
                    >

                        <td>
                            ${index + 1}
                        </td>


                        <td>

                            <b>
                                ${escapeHtml(
                                    student.rollNo ||
                                    student.roll ||
                                    "—"
                                )}
                            </b>

                        </td>


                        <td>

                            ${escapeHtml(
                                student.name ||
                                student.studentName ||
                                "Unnamed Student"
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                student.section ||
                                "—"
                            )}

                        </td>


                        <td>

                            <div
                                class="status-buttons"
                            >

                                <button
                                    type="button"
                                    class="status-btn present ${
                                        status === "P"
                                            ? "active"
                                            : ""
                                    }"
                                    data-status="P"
                                >
                                    P
                                </button>


                                <button
                                    type="button"
                                    class="status-btn absent ${
                                        status === "A"
                                            ? "active"
                                            : ""
                                    }"
                                    data-status="A"
                                >
                                    A
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }

        )
        .join("");


    attachStatusEvents();

}



/* =====================================================
   EMPTY STUDENTS
===================================================== */

function renderEmptyStudents(message){

    $("studentCount")
        .textContent =
            "0 students";


    $("studentTableBody")
        .innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >

                    <div class="empty-icon">
                        👨‍🎓
                    </div>

                    ${escapeHtml(message)}

                </td>

            </tr>

        `;

}



/* =====================================================
   STATUS EVENT
===================================================== */

function attachStatusEvents(){

    document
        .querySelectorAll(
            "#studentTableBody [data-status]"
        )
        .forEach(

            function(button){

                button.addEventListener(

                    "click",

                    function(){

                        const row =
                            button.closest(
                                "tr"
                            );


                        row
                            .querySelectorAll(
                                "[data-status]"
                            )
                            .forEach(

                                function(btn){

                                    btn.classList
                                        .remove(
                                            "active"
                                        );

                                }

                            );


                        button.classList
                            .add(
                                "active"
                            );


                        row.dataset.status =
                            button.dataset.status;

                    }

                );

            }

        );

}



/* =====================================================
   LOAD ALL SUBJECTS
===================================================== */

async function loadAllSubjects(){

    try{

        console.log(
            "Loading subjects..."
        );


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "subjects"
                )

            );


        allSubjects =
            snapshot.docs.map(

                function(document){

                    return {

                        id:
                            document.id,

                        ...document.data()

                    };

                }

            );


        console.log(
            "Subjects loaded:",
            allSubjects.length
        );


        renderSubjectOptions();


    }

    catch(error){

        console.error(
            "Subjects error:",
            error
        );


        showError(
            "Subjects load nahi ho rahe: " +
            error.message
        );


        $("subject").innerHTML = `

            <option value="">
                No subjects found
            </option>

        `;

    }

}



/* =====================================================
   RENDER SUBJECTS
===================================================== */

function renderSubjectOptions(){

    const selectedSection =
        normalize(
            $("section").value
        );


    const selectedSemester =
        normalize(
            $("semester").value
        );


    const filteredSubjects =
        allSubjects.filter(

            function(subject){

                if(
                    subject.active === false
                ){

                    return false;

                }


                const subjectSection =
                    normalize(
                        subject.section
                    );


                const subjectSemester =
                    normalize(
                        subject.semester
                    );


                /*
                 * If section exists,
                 * match it.
                 */

                if(
                    subjectSection
                    &&
                    selectedSection
                    &&
                    subjectSection !==
                        selectedSection
                ){

                    return false;

                }


                /*
                 * If semester exists,
                 * match it.
                 */

                if(
                    subjectSemester
                    &&
                    selectedSemester
                    &&
                    subjectSemester !==
                        selectedSemester
                ){

                    return false;

                }


                return true;

            }

        )
        .sort(

            function(a,b){

                return String(
                    a.code ||
                    a.name ||
                    ""
                )
                .localeCompare(
                    String(
                        b.code ||
                        b.name ||
                        ""
                    )
                );

            }

        );


    $("subject").innerHTML = `

        <option value="">
            Select subject / lecture
        </option>

    `;


    filteredSubjects.forEach(

        function(subject){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                subject.id;


            const code =
                subject.code
                ? subject.code + " — "
                : "";


            option.textContent =
                code +
                (
                    subject.name ||
                    "Unnamed Subject"
                );


            $("subject")
                .appendChild(
                    option
                );

        }

    );


    /*
     * No subject
     */

    if(
        filteredSubjects.length === 0
    ){

        const option =
            document.createElement(
                "option"
            );


        option.value = "";

        option.textContent =
            "No subject found";


        $("subject")
            .appendChild(
                option
            );

    }

}



/* =====================================================
   SUBJECT CHANGE
===================================================== */

$("subject")
    .addEventListener(

        "change",

        function(){

            selectedSubject =
                allSubjects.find(

                    function(subject){

                        return (
                            subject.id ===
                            $("subject").value
                        );

                    }

                ) || null;


            filterAndRenderStudents();

        }

    );



/* =====================================================
   LOAD EXISTING ATTENDANCE
===================================================== */

async function loadExistingAttendance(){

    try{

        attendanceRecords = [];


        const selectedDate =
            $("date").value;


        if(
            !selectedDate
        ){

            return;

        }


        /*
         * Only DATE query.
         *
         * This avoids composite indexes.
         */

        const attendanceQuery =
            query(

                collection(
                    db,
                    "attendance"
                ),

                where(
                    "date",
                    "==",
                    selectedDate
                )

            );


        const snapshot =
            await getDocs(
                attendanceQuery
            );


        attendanceRecords =
            snapshot.docs.map(

                function(document){

                    return {

                        id:
                            document.id,

                        ...document.data()

                    };

                }

            );


        console.log(
            "Existing attendance:",
            attendanceRecords.length
        );


        filterAndRenderStudents();

    }

    catch(error){

        console.error(
            "Existing attendance error:",
            error
        );


        showError(
            "Existing attendance load nahi hui: " +
            error.message
        );

    }

}



/* =====================================================
   EXISTING STATUS
===================================================== */

function getExistingStatus(studentId){

    if(
        !selectedSubject
    ){

        return "";

    }


    const record =
        attendanceRecords.find(

            function(item){

                return (

                    String(
                        item.studentId
                    ) ===
                    String(
                        studentId
                    )

                    &&

                    String(
                        item.subjectId
                    ) ===
                    String(
                        selectedSubject.id
                    )

                );

            }

        );


    if(
        !record
    ){

        return "";

    }


    return (
        record.status || ""
    )
    .toUpperCase();

}



/* =====================================================
   DATE CHANGE
===================================================== */

$("date")
    .addEventListener(

        "change",

        async function(){

            hideError();

            await loadExistingAttendance();

        }

    );

/* =====================================================
   CREATE ATTENDANCE DOCUMENT ID
===================================================== */

function createAttendanceId(
    studentId,
    date,
    subjectId
){

    return (

        String(studentId)

        + "_"

        + String(date)

        + "_"

        + String(subjectId)

    )
    .replace(
        /[\/\\#?[\]\s]/g,
        "_"
    );

}



/* =====================================================
   SAVE ATTENDANCE
===================================================== */

$("saveAttendance")
    .addEventListener(

        "click",

        async function(){

            hideError();


            if(
                !selectedSubject
            ){

                alert(
                    "Pehle Subject / Lecture select karein."
                );

                return;

            }


            const rows =
                Array.from(

                    document.querySelectorAll(
                        "#studentTableBody tr[data-student-id]"
                    )

                );


            if(
                rows.length === 0
            ){

                alert(
                    "Koi student nahi mila."
                );

                return;

            }


            const markedRows =
                rows.filter(

                    function(row){

                        return (

                            row.dataset.status ===
                            "P"

                            ||

                            row.dataset.status ===
                            "A"

                        );

                    }

                );


            if(
                markedRows.length === 0
            ){

                alert(
                    "Students ko P ya A mark karein."
                );

                return;

            }


            const saveButton =
                $("saveAttendance");


            saveButton.disabled =
                true;


            saveButton.textContent =
                "Saving...";


            try{

                let savedCount = 0;


                for(
                    const row of markedRows
                ){

                    const studentId =
                        row.dataset.studentId;


                    const student =
                        allStudents.find(

                            function(item){

                                return (
                                    String(
                                        item.id
                                    ) ===
                                    String(
                                        studentId
                                    )
                                );

                            }

                        );


                    if(
                        !student
                    ){

                        continue;

                    }


                    const documentId =
                        createAttendanceId(

                            student.id,

                            $("date").value,

                            selectedSubject.id

                        );


                    await setDoc(

                        doc(
                            db,
                            "attendance",
                            documentId
                        ),

                        {

                            studentId:
                                student.id,

                            studentName:
                                student.name ||
                                student.studentName ||
                                "",

                            rollNo:
                                student.rollNo ||
                                student.roll ||
                                "",

                            date:
                                $("date").value,

                            section:
                                student.section ||
                                $("section").value,

                            semester:
                                student.semester ||
                                $("semester").value,

                            subjectId:
                                selectedSubject.id,

                            subjectCode:
                                selectedSubject.code ||
                                "",

                            subjectName:
                                selectedSubject.name ||
                                "",

                            lectureType:
                                selectedSubject.lectureType ||
                                "Theory",

                            status:
                                row.dataset.status,

                            markedBy:
                                currentUser?.uid ||
                                currentUser?.id ||
                                currentUser?.username ||
                                currentUser?.email ||
                                "faculty",

                            updatedAt:
                                serverTimestamp()

                        },

                        {
                            merge:true
                        }

                    );


                    savedCount++;

                }


                await loadExistingAttendance();


                showSuccess(

                    "✓ Attendance saved successfully for "

                    +

                    savedCount

                    +

                    " students."

                );

            }

            catch(error){

                console.error(
                    "SAVE ERROR:",
                    error
                );


                showError(

                    "Attendance save nahi hui: "

                    +

                    error.message

                );

            }

            finally{

                saveButton.disabled =
                    false;


                saveButton.textContent =
                    "Save Attendance";

            }

        }

    );



/* =====================================================
   REFRESH
===================================================== */

$("refreshBtn")
    .addEventListener(

        "click",

        async function(){

            const button =
                $("refreshBtn");


            button.disabled =
                true;


            button.textContent =
                "↻";


            try{

                hideError();


                await loadAllSubjects();

                await loadAllStudents();

                await loadExistingAttendance();


                showSuccess(
                    "✓ Data refreshed."
                );

            }

            catch(error){

                showError(
                    error.message
                );

            }

            finally{

                button.disabled =
                    false;

            }

        }

    );
