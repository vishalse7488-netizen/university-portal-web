<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOTICE BOARD</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            background: #f4f6f8;

            min-height: 100vh;

        }


        /* =========================
           TOP NAVBAR
        ========================= */

        .navbar {

            background: #007BFF;

            color: white;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: relative;

            min-height: 60px;

        }


        .navbar h1 {

            font-size: 20px;

            margin: 0;

            font-weight: 500;

        }


        /* Center Title */

        .center-title {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-size: 22px;

            font-weight: bold;

            letter-spacing: 1px;

            white-space: nowrap;

        }


        /* Logout Button */

        .logout-btn {

            color: white;

            text-decoration: none;

            background: #dc3545;

            padding: 8px 15px;

            border-radius: 5px;

            transition: 0.3s;

        }


        .logout-btn:hover {

            background: #c82333;

        }


        /* =========================
           SECONDARY MENU BAR
        ========================= */

        .menu-bar {

            background: #0056b3;

            display: flex;

            justify-content: flex-start;

            align-items: center;

            padding: 10px 20px;

            gap: 30px;

            overflow-x: auto;

        }


        .menu-bar a {

            color: white;

            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;

            white-space: nowrap;

        }


        .menu-bar a:hover {

            color: #FFD700;

            text-decoration: underline;

        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {

            position: relative;

            text-align: center;

            margin-top: 50px;

            min-height: 65vh;

            padding: 40px 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* Background Logo */

        .content::before {

            content: "";

            background-image: url(
                'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROm-q6zzbd-JBo9REw4aL4FtlpVUmek1sWlA&s'
            );

            background-repeat: no-repeat;

            background-position: center;

            background-size: 300px 300px;

            opacity: 0.15;

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 0;

        }


        /* Content should stay above logo */

        .content h2,
        .content p,
        .dashboard-card {

            position: relative;

            z-index: 1;

        }


        .content h2 {

            color: #333;

            font-size: 30px;

            margin-bottom: 10px;

        }


        .content p {

            color: #555;

            font-size: 17px;

        }


        /* =========================
           DASHBOARD CARD
        ========================= */

        .dashboard-card {

            margin-top: 20px;

            background: rgba(255, 255, 255, 0.92);

            padding: 25px 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

        }


        .dashboard-card h3 {

            margin-top: 0;

            color: #007BFF;

        }


        .dashboard-card p {

            margin-bottom: 0;

        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 12px;

                min-height: 100px;

                flex-direction: column;

                gap: 12px;

                justify-content: center;

            }


            .navbar h1 {

                font-size: 15px;

                text-align: center;

            }


            .center-title {

                position: static;

                transform: none;

                font-size: 20px;

                order: -1;

            }


            .logout-btn {

                padding: 7px 14px;

                font-size: 14px;

            }


            .menu-bar {

                flex-direction: column;

                gap: 12px;

                padding: 14px;

                overflow-x: visible;

            }


            .menu-bar a {

                font-size: 15px;

            }


            .content {

                margin-top: 20px;

                min-height: 65vh;

                padding: 30px 15px;

            }


            .content h2 {

                font-size: 24px;

            }


            .content p {

                font-size: 15px;

            }


            .dashboard-card {

                width: 100%;

                max-width: 350px;

                padding: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <h1 id="welcomeText">
            Welcome 👋
        </h1>


        <div class="center-title">
            Notice Board
        </div>


        <a
            href="#"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </a>

    </div>



    <!-- =========================
         MENU BAR
    ========================= -->

    <div class="menu-bar">

        <a href="menu.html">
            Menu
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="about.html">
            About
        </a>

        <a href="location.html">
            Location
        </a>

        <a href="feedback.html">
            Feedback
        </a>

        <a href="contact.html">
            Contact Us
        </a>

    </div>



    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="content">

        <h2>
            Dashboard Page
        </h2>


        <p>
            You are successfully logged in.
        </p>


        <div class="dashboard-card">

            <h3>
                🎓 University Portal
            </h3>

            <p>
                Welcome to your University Dashboard.
            </p>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
         * Get login information
         * from localStorage.
         */

        const email =
            localStorage.getItem("userEmail");



        /*
         * If user is not logged in,
         * send them to login page.
         */

        if (!email) {

            window.location.href =
                "login.html";

        }



        /*
         * Show logged-in email.
         */

        if (email) {

            document.getElementById(
                "welcomeText"
            ).textContent =
                "Welcome, " + email + " 👋";

        }



        /*
         * Logout
         */

        document.getElementById(
            "logoutBtn"
        ).addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                /*
                 * Remove login information
                 */

                localStorage.removeItem(
                    "userEmail"
                );

                localStorage.removeItem(
                    "isLoggedIn"
                );


                /*
                 * Go back to login
                 */

                window.location.href =
                    "login.html";

            }
        );

    </script>


</body>

</html>
