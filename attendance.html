<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef4ff;color:#102653}
.topbar{height:84px;background:#fff;display:flex;align-items:center;gap:18px;padding:14px 28px;border-bottom:1px solid #dce5f4;position:sticky;top:0;z-index:100}
.menu-btn{border:0;background:transparent;color:#102653;font-size:31px;cursor:pointer;padding:4px}
.page-title{flex:1;font-size:29px;font-weight:800}
.top-btn{border:0;border-radius:16px;min-height:50px;padding:0 20px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(100deg,#46c4e7,#2057dc)}
.refresh-btn{width:52px;padding:0;font-size:26px}
.container{width:100%;max-width:1180px;margin:auto;padding:28px}
.card{background:#fff;border-radius:28px;padding:25px;margin-bottom:23px;box-shadow:0 6px 24px rgba(44,83,145,.10)}
.message{padding:15px 18px;border-radius:14px;margin-bottom:18px;font-size:15px;line-height:1.5}
.error{background:#ffe8e8;color:#b92e38;border:1px solid #f3b9bd}
.success{background:#e6f8ee;color:#168b55;border:1px solid #bfe6d1}
.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.form-group label{display:block;margin-bottom:9px;font-size:15px;font-weight:700}
.form-control{width:100%;height:56px;padding:0 14px;border:2px solid #d8e3f3;border-radius:15px;background:#f7faff;color:#18345e;font-size:16px;outline:none}
.form-control:focus{border-color:#5da1ed;background:#fff}
.student-header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.student-header h2{margin:0;flex:1;font-size:25px}
.count{color:#8492a7;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.summary-box{padding:20px;border-radius:18px;background:#f4f8ff;text-align:center}
.summary-box strong{display:block;font-size:28px;margin-bottom:5px}
.summary-box span{color:#71809a;font-weight:700}
.table-container{width:100%;overflow-x:auto}
table{width:100%;min-width:700px;border-collapse:collapse}
thead th{background:#edf4ff;color:#102653;text-align:left;padding:16px 15px;font-size:15px;font-weight:800}
tbody td{padding:15px;border-bottom:1px solid #e4e9f1;font-size:15px}
tbody tr:hover td{background:#fafcff}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:85px;padding:8px 13px;border-radius:10px;font-weight:800}
.present{background:#dff5e9;color:#15995a}
.absent{background:#ffe3e6;color:#db3945}
.pending{background:#edf1f7;color:#71809a}
.empty{text-align:center;padding:45px 20px;color:#8492a7}
.empty-icon{font-size:46px;margin-bottom:10px}
.loading{text-align:center;padding:35px;color:#5d6f8b}

@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
.topbar{height:72px;padding:10px 13px;gap:9px}
.menu-btn{font-size:27px}.page-title{font-size:22px}
.top-btn{min-height:44px;padding:0 12px;border-radius:13px;font-size:14px}
.refresh-btn{width:45px;font-size:24px}
.container{padding:14px}.card{padding:19px;border-radius:23px}
.form-grid{grid-template-columns:1fr 1fr;gap:11px}
.form-control{height:51px;font-size:14px}
.summary{grid-template-columns:1fr}
}
</style>

<style>
.filter-required{
    text-align:center;
    padding:45px 20px;
    color:#71809a;
}
.filter-required .big{
    font-size:46px;
    margin-bottom:10px;
}
.filter-required b{
    color:#18345e;
}
</style>

</head>

<body>

<header class="topbar">
    <button class="menu-btn" type="button" onclick="history.back()">☰</button>
    <div class="page-title">Attendance</div>
    <button class="top-btn" type="button" onclick="history.back()">‹ Back</button>
    <button id="refreshBtn" class="top-btn refresh-btn" type="button" title="Refresh">↻</button>
</header>

<main class="container">

    <div id="errorMessage" class="message error hidden"></div>
    <div id="successMessage" class="message success hidden"></div>

    <section class="card">
        <div class="form-grid">

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" class="form-control">
                    <option value="Sem-1">Sem-1</option>
                    <option value="Sem-2">Sem-2</option>
                    <option value="" selected>Select Semester</option>
                    <option value="Sem-3">Sem-3</option>
                    <option value="Sem-4">Sem-4</option>
                    <option value="Sem-5">Sem-5</option>
                    <option value="Sem-6">Sem-6</option>
                    <option value="Sem-7">Sem-7</option>
                    <option value="Sem-8">Sem-8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section</label>
                <select id="section" class="form-control">
                    <option value="" selected>Select Section</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject / Lecture</label>
                <select id="subject" class="form-control">
                    <option value="" selected>Select Subject / Lecture</option>
                </select>
            </div>

            <div class="form-group">
                <label for="month">Month</label>
                <input id="month" class="form-control" type="month">
            </div>

        </div>
    </section>

    <section class="card">
        <div class="student-header">
            <h2>Attendance Summary</h2>
            <span id="studentName" class="count">Loading...</span>
        </div>

        <div class="summary">
            <div class="summary-box">
                <strong id="totalClasses">0</strong>
                <span>Total Classes</span>
            </div>
            <div class="summary-box">
                <strong id="presentClasses">0</strong>
                <span>Present</span>
            </div>
            <div class="summary-box">
                <strong id="attendancePercent">0%</strong>
                <span>Attendance</span>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="student-header">
            <h2>Attendance Records</h2>
            <span id="recordCount" class="count">0 records</span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Lecture Type</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTableBody">
                    <tr>
                        <td colspan="5" class="loading">Loading attendance...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",
    authDomain: "university-portal-2107e.firebaseapp.com",
    projectId: "university-portal-2107e",
    storageBucket: "university-portal-2107e.firebasestorage.app",
    messagingSenderId: "50848903813",
    appId: "1:50848903813:web:8296090d0d9268cfd2efec",
    measurementId: "G-LKTX7C7F0E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let allAttendance = [];
let subjects = [];
let currentUid = "";


/* =====================================================
   HELPERS
===================================================== */

const norm = value =>
    String(value ?? "").trim().toLowerCase();

function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[c]));
}

function showError(message){
    console.error(message);
    $("errorMessage").textContent = message;
    $("errorMessage").classList.remove("hidden");
}

function clearError(){
    $("errorMessage").classList.add("hidden");
}

function showSuccess(message){
    $("successMessage").textContent = message;
    $("successMessage").classList.remove("hidden");

    setTimeout(() => {
        $("successMessage").classList.add("hidden");
    }, 3000);
}


/* =====================================================
   STRICT FILTER CHECK
   IMPORTANT:
   Attendance MUST NOT LOAD until:
   Semester + Section + Subject + Month
   are selected.
===================================================== */

function filtersReady(){

    const semester =
        $("semester").value.trim();

    const section =
        $("section").value.trim();

    const subject =
        $("subject").value.trim();

    const month =
        $("month").value.trim();

    return (
        semester !== "" &&
        section !== "" &&
        subject !== "" &&
        month !== ""
    );
}


function showFilterRequired(){

    $("studentName").textContent =
        "Select filters";

    $("totalClasses").textContent = "0";
    $("presentClasses").textContent = "0";
    $("attendancePercent").textContent = "0%";
    $("recordCount").textContent = "0 records";

    $("attendanceTableBody").innerHTML = `
        <tr>
            <td colspan="5" class="filter-required">

                <div class="big">🔎</div>

                <b>Select Semester, Section, Subject / Lecture
                and Month</b>

                <br><br>

                Attendance yahan tabhi dikhegi jab
                saare filters select hon.

            </td>
        </tr>
    `;
}


/* =====================================================
   GET LOGGED-IN UID
===================================================== */

function getLoggedInUid(){

    if(auth.currentUser?.uid){
        return auth.currentUser.uid.trim();
    }

    const keys = [
        "userUid",
        "uid",
        "userId",
        "firebaseUid",
        "firebaseUID"
    ];

    for(const key of keys){

        const value =
            localStorage.getItem(key);

        if(value && value.trim()){
            return value.trim();
        }
    }

    return "";
}


/* =====================================================
   LOAD SUBJECTS
===================================================== */

async function loadSubjects(){

    const snap =
        await getDocs(
            collection(db,"subjects")
        );

    subjects =
        snap.docs.map(d => ({
            id:d.id,
            ...d.data()
        }));

    renderSubjectOptions();
}


/* =====================================================
   SUBJECT DROPDOWN
===================================================== */

function renderSubjectOptions(){

    const section =
        norm($("section").value);

    const semester =
        norm($("semester").value);

    const select =
        $("subject");

    select.innerHTML =
        `<option value="">
            Select Subject / Lecture
        </option>`;

    if(!section || !semester){
        return;
    }

    subjects
        .filter(subject => {

            if(subject.active === false){
                return false;
            }

            const subjectSection =
                norm(subject.section);

            const subjectSemester =
                norm(
                    subject.semester ||
                    subject.semeter
                );

            return (
                (!subjectSection ||
                 subjectSection === section) &&

                (!subjectSemester ||
                 subjectSemester === semester)
            );
        })
        .forEach(subject => {

            const option =
                document.createElement("option");

            option.value =
                subject.id;

            option.textContent =
                (
                    subject.code
                    ? subject.code + " — "
                    : ""
                ) +
                (
                    subject.name ||
                    subject.lectureName ||
                    "Unnamed Subject"
                );

            select.appendChild(option);
        });
}


/* =====================================================
   LOAD ATTENDANCE
   STRICTLY UID + ALL SELECTED FILTERS
===================================================== */

async function loadAttendance(){

    clearError();

    /*
     * VERY IMPORTANT:
     * Do NOT query Firestore before all filters
     * have been selected.
     */
    if(!filtersReady()){

        allAttendance = [];

        showFilterRequired();

        return;
    }


    currentUid =
        getLoggedInUid();


    if(!currentUid){

        allAttendance = [];

        $("studentName").textContent =
            "Student login required";

        $("totalClasses").textContent = "0";
        $("presentClasses").textContent = "0";
        $("attendancePercent").textContent = "0%";
        $("recordCount").textContent = "0 records";

        $("attendanceTableBody").innerHTML = `
            <tr>
                <td colspan="5" class="empty">

                    <div class="empty-icon">🔐</div>

                    Firebase User UID nahi mila.

                    <br><br>

                    Logout karke dobara login karein.

                </td>
            </tr>
        `;

        return;
    }


    $("studentName").textContent =
        "Loading...";

    $("attendanceTableBody").innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                Loading attendance...
            </td>
        </tr>
    `;


    /*
     * UID is mandatory.
     *
     * Only records belonging to the logged-in
     * Firebase Authentication UID are loaded.
     */
    const uidQuery =
        query(
            collection(db,"attendance"),
            where(
                "userUid",
                "==",
                currentUid
            )
        );


    const uidSnap =
        await getDocs(uidQuery);


    allAttendance =
        uidSnap.docs.map(d => ({
            id:d.id,
            ...d.data()
        }));


    renderAttendance();
}


/* =====================================================
   FILTER RECORDS
===================================================== */

function getFilteredRecords(){

    const month =
        $("month").value;

    const subjectId =
        $("subject").value;

    const semester =
        norm($("semester").value);

    const section =
        norm($("section").value);


    return allAttendance
        .filter(record => {

            /*
             * Month is mandatory.
             */
            if(
                !String(record.date || "")
                    .startsWith(month)
            ){
                return false;
            }


            /*
             * Specific subject/lecture is mandatory.
             */
            if(
                String(record.subjectId || "") !==
                String(subjectId)
            ){
                return false;
            }


            /*
             * Section.
             */
            if(
                norm(record.section) !==
                section
            ){
                return false;
            }


            /*
             * Semester.
             */
            const recordSemester =
                norm(
                    record.semester ||
                    record.semeter
                );

            if(
                recordSemester !==
                semester
            ){
                return false;
            }


            return true;
        })
        .sort((a,b) =>
            String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                )
        );
}


/* =====================================================
   RENDER ATTENDANCE
===================================================== */

function renderAttendance(){

    if(!filtersReady()){

        showFilterRequired();

        return;
    }


    const records =
        getFilteredRecords();


    const present =
        records.filter(record => {

            const status =
                norm(record.status);

            return (
                status === "p" ||
                status === "present"
            );

        }).length;


    const total =
        records.length;


    const percentage =
        total
        ? Math.round(
            (present / total) * 100
        )
        : 0;


    $("totalClasses").textContent =
        total;

    $("presentClasses").textContent =
        present;

    $("attendancePercent").textContent =
        percentage + "%";

    $("recordCount").textContent =
        total + " records";


    /*
     * Student name comes from the attendance
     * record only after the UID filter has passed.
     */
    if(records.length){

        $("studentName").textContent =
            records[0].studentName ||
            records[0].name ||
            "Student";

    }else{

        $("studentName").textContent =
            "No attendance found";
    }


    if(!records.length){

        $("attendanceTableBody").innerHTML = `
            <tr>
                <td colspan="5" class="empty">

                    <div class="empty-icon">📋</div>

                    No attendance records found
                    for the selected filters.

                </td>
            </tr>
        `;

        return;
    }


    $("attendanceTableBody").innerHTML =
        records.map((record,index) => {

            const status =
                norm(record.status);

            const isPresent =
                status === "p" ||
                status === "present";

            const statusText =
                isPresent
                ? "✓ Present"
                : "✕ Absent";

            const statusClass =
                isPresent
                ? "present"
                : "absent";


            return `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <b>
                            ${esc(
                                record.date || "—"
                            )}
                        </b>
                    </td>

                    <td>
                        ${esc(
                            record.subjectCode
                            ? record.subjectCode +
                              " — " +
                              (
                                record.subjectName ||
                                ""
                              )
                            : (
                                record.subjectName ||
                                record.subject ||
                                "—"
                            )
                        )}
                    </td>

                    <td>
                        ${esc(
                            record.lectureType ||
                            record.type ||
                            "Theory"
                        )}
                    </td>

                    <td>
                        <span
                            class="badge ${statusClass}"
                        >
                            ${statusText}
                        </span>
                    </td>

                </tr>
            `;

        }).join("");
}


/* =====================================================
   FILTER EVENTS
===================================================== */

$("semester").addEventListener(
    "change",
    async () => {

        $("subject").value = "";

        renderSubjectOptions();

        /*
         * Clearing subject forces the page back
         * to "select all filters" state.
         */
        renderAttendance();

    }
);


$("section").addEventListener(
    "change",
    async () => {

        $("subject").value = "";

        renderSubjectOptions();

        renderAttendance();

    }
);


$("subject").addEventListener(
    "change",
    async () => {

        await loadAttendance();

    }
);


$("month").addEventListener(
    "change",
    async () => {

        await loadAttendance();

    }
);


/* =====================================================
   REFRESH
===================================================== */

$("refreshBtn").addEventListener(
    "click",
    async () => {

        try{

            clearError();

            if(!filtersReady()){

                showFilterRequired();

                return;
            }

            $("refreshBtn").disabled =
                true;

            await loadSubjects();
            await loadAttendance();

            showSuccess(
                "✓ Attendance refreshed."
            );

        }catch(error){

            showError(
                "Refresh failed: " +
                error.message
            );

        }finally{

            $("refreshBtn").disabled =
                false;
        }
    }
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        try{

            currentUid =
                user?.uid ||
                getLoggedInUid();


            /*
             * Do not load attendance here unless
             * the user has actually selected all filters.
             */
            await loadSubjects();

            if(filtersReady()){

                await loadAttendance();

            }else{

                showFilterRequired();
            }


        }catch(error){

            showError(
                "Attendance load error: " +
                error.message
            );
        }
    }
);


/* =====================================================
   INITIAL PAGE STATE
===================================================== */

async function init(){

    $("semester").value = "";
    $("section").value = "";
    $("subject").innerHTML =
        `<option value="">
            Select Subject / Lecture
        </option>`;
    $("month").value = "";

    resetPage();

    try{

        await loadSubjects();

    }catch(error){

        showError(
            "Subject load error: " +
            error.message
        );
    }
}


function resetPage(){

    allAttendance = [];

    $("studentName").textContent =
        "Select filters";

    $("totalClasses").textContent =
        "0";

    $("presentClasses").textContent =
        "0";

    $("attendancePercent").textContent =
        "0%";

    $("recordCount").textContent =
        "0 records";

    showFilterRequired();
}


init();

</script>
</body>
</html>
