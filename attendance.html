<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef4ff;color:#102653}
.topbar{height:84px;background:#fff;display:flex;align-items:center;gap:18px;padding:14px 28px;border-bottom:1px solid #dce5f4;position:sticky;top:0;z-index:100}
.menu-btn{border:0;background:transparent;color:#102653;font-size:31px;cursor:pointer;padding:4px}
.page-title{flex:1;font-size:29px;font-weight:800}
.top-btn{border:0;border-radius:16px;min-height:50px;padding:0 20px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(100deg,#46c4e7,#2057dc)}
.refresh-btn{width:52px;padding:0;font-size:26px}
.container{width:100%;max-width:1180px;margin:auto;padding:28px}
.card{background:#fff;border-radius:28px;padding:25px;margin-bottom:23px;box-shadow:0 6px 24px rgba(44,83,145,.10)}
.message{padding:15px 18px;border-radius:14px;margin-bottom:18px;font-size:15px;line-height:1.5}
.error{background:#ffe8e8;color:#b92e38;border:1px solid #f3b9bd}
.success{background:#e6f8ee;color:#168b55;border:1px solid #bfe6d1}
.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.form-group label{display:block;margin-bottom:9px;font-size:15px;font-weight:700}
.form-control{width:100%;height:56px;padding:0 14px;border:2px solid #d8e3f3;border-radius:15px;background:#f7faff;color:#18345e;font-size:16px;outline:none}
.form-control:focus{border-color:#5da1ed;background:#fff}
.student-header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.student-header h2{margin:0;flex:1;font-size:25px}
.count{color:#8492a7;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.summary-box{padding:20px;border-radius:18px;background:#f4f8ff;text-align:center}
.summary-box strong{display:block;font-size:28px;margin-bottom:5px}
.summary-box span{color:#71809a;font-weight:700}
.table-container{width:100%;overflow-x:auto}
table{width:100%;min-width:700px;border-collapse:collapse}
thead th{background:#edf4ff;color:#102653;text-align:left;padding:16px 15px;font-size:15px;font-weight:800}
tbody td{padding:15px;border-bottom:1px solid #e4e9f1;font-size:15px}
tbody tr:hover td{background:#fafcff}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:85px;padding:8px 13px;border-radius:10px;font-weight:800}
.present{background:#dff5e9;color:#15995a}
.absent{background:#ffe3e6;color:#db3945}
.pending{background:#edf1f7;color:#71809a}
.empty{text-align:center;padding:45px 20px;color:#8492a7}
.empty-icon{font-size:46px;margin-bottom:10px}
.loading{text-align:center;padding:35px;color:#5d6f8b}

@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
.topbar{height:72px;padding:10px 13px;gap:9px}
.menu-btn{font-size:27px}.page-title{font-size:22px}
.top-btn{min-height:44px;padding:0 12px;border-radius:13px;font-size:14px}
.refresh-btn{width:45px;font-size:24px}
.container{padding:14px}.card{padding:19px;border-radius:23px}
.form-grid{grid-template-columns:1fr 1fr;gap:11px}
.form-control{height:51px;font-size:14px}
.summary{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="topbar">
    <button class="menu-btn" type="button" onclick="history.back()">☰</button>
    <div class="page-title">Attendance</div>
    <button class="top-btn" type="button" onclick="history.back()">‹ Back</button>
    <button id="refreshBtn" class="top-btn refresh-btn" type="button" title="Refresh">↻</button>
</header>

<main class="container">

    <div id="errorMessage" class="message error hidden"></div>
    <div id="successMessage" class="message success hidden"></div>

    <section class="card">
        <div class="form-grid">

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" class="form-control">
                    <option value="Sem-1">Sem-1</option>
                    <option value="Sem-2">Sem-2</option>
                    <option value="Sem-3" selected>Sem-3</option>
                    <option value="Sem-4">Sem-4</option>
                    <option value="Sem-5">Sem-5</option>
                    <option value="Sem-6">Sem-6</option>
                    <option value="Sem-7">Sem-7</option>
                    <option value="Sem-8">Sem-8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section</label>
                <select id="section" class="form-control">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject / Lecture</label>
                <select id="subject" class="form-control">
                    <option value="">All Subjects</option>
                </select>
            </div>

            <div class="form-group">
                <label for="month">Month</label>
                <input id="month" class="form-control" type="month">
            </div>

        </div>
    </section>

    <section class="card">
        <div class="student-header">
            <h2>Attendance Summary</h2>
            <span id="studentName" class="count">Loading...</span>
        </div>

        <div class="summary">
            <div class="summary-box">
                <strong id="totalClasses">0</strong>
                <span>Total Classes</span>
            </div>
            <div class="summary-box">
                <strong id="presentClasses">0</strong>
                <span>Present</span>
            </div>
            <div class="summary-box">
                <strong id="attendancePercent">0%</strong>
                <span>Attendance</span>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="student-header">
            <h2>Attendance Records</h2>
            <span id="recordCount" class="count">0 records</span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Lecture Type</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTableBody">
                    <tr>
                        <td colspan="5" class="loading">Loading attendance...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",
    authDomain: "university-portal-2107e.firebaseapp.com",
    projectId: "university-portal-2107e",
    storageBucket: "university-portal-2107e.firebasestorage.app",
    messagingSenderId: "50848903813",
    appId: "1:50848903813:web:8296090d0d9268cfd2efec",
    measurementId: "G-LKTX7C7F0E"
};

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

let attendanceRecords = [];
let subjects = [];

const norm = value =>
    String(value ?? "").trim().toLowerCase();

function esc(value){
    return String(value ?? "").replace(/[&<>"']/g,c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[c]));
}

function showError(message){
    console.error(message);
    $("errorMessage").textContent = message;
    $("errorMessage").classList.remove("hidden");
}

function clearError(){
    $("errorMessage").classList.add("hidden");
}

function showSuccess(message){
    $("successMessage").textContent = message;
    $("successMessage").classList.remove("hidden");
    setTimeout(()=>$("successMessage").classList.add("hidden"),4000);
}

function getCurrentMonth(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}


/*
=====================================================
GET LOGGED-IN STUDENT
=====================================================

This page supports these localStorage keys:

studentId
userId
username

If your login stores studentId, it will be used first.
*/

async function loadStudentsForAttendance(){

    const snap =
        await getDocs(
            collection(db,"students")
        );

    allStudents =
        snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

    console.log(
        "Students loaded:",
        allStudents.length
    );
}

async function resolveStudent(){

    /*
     * UID-FIRST ATTENDANCE
     *
     * The logged-in user's Firebase UID is the primary identity.
     * Attendance is read using userUid, not roll number/name.
     */
    const loginUid =
        (
            localStorage.getItem("userUid") ||
            localStorage.getItem("uid") ||
            localStorage.getItem("userId") ||
            ""
        ).trim();

    console.log("Logged-in USER UID:", loginUid);

    if(!loginUid){
        return null;
    }

    /*
     * 1. First try students collection where uid/userUid/userId
     *    equals the logged-in UID.
     */
    const studentSnap =
        await getDocs(collection(db,"students"));

    const students =
        studentSnap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

    let student =
        students.find(s =>
            String(s.uid || "").trim() === loginUid ||
            String(s.userUid || "").trim() === loginUid ||
            String(s.userId || "").trim() === loginUid
        );

    /*
     * 2. If students document ID itself is the UID.
     */
    if(!student){
        student =
            students.find(s =>
                String(s.id).trim() === loginUid
            );
    }

    /*
     * 3. Resolve through users collection using UID.
     * This supports a setup where users/{uid} contains studentId,
     * rollNo or username.
     */
    if(!student){

        const userRef =
            await getDocs(
                query(
                    collection(db,"users"),
                    where("__name__","==",loginUid)
                )
            );

        if(!userRef.empty){

            const user =
                userRef.docs[0].data();

            const studentRef =
                user.studentId ||
                user.studentID ||
                user.student_id ||
                user.rollNo ||
                user.roll ||
                user.username;

            if(studentRef){

                student =
                    students.find(s =>
                    [
                        s.id,
                        s.studentId,
                        s.rollNo,
                        s.roll,
                        s.username,
                        s.email
                    ].some(v =>
                        norm(v) === norm(studentRef)
                    )
                );
            }
        }
    }

    if(student){
        console.log("UID MATCHED STUDENT:", student);
    }

    return student || null;
}


/*
=====================================================
LOAD SUBJECTS
=====================================================
*/

async function loadSubjects(){

    const snap =
        await getDocs(
            collection(db,"subjects")
        );

    subjects =
        snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

    renderSubjectOptions();
}


/*
=====================================================
LOAD ATTENDANCE BY USER UID
=====================================================
*/

async function loadAttendance(){

    clearError();

    const loginUid =
        (
            localStorage.getItem("userUid") ||
            localStorage.getItem("uid") ||
            localStorage.getItem("userId") ||
            ""
        ).trim();

    if(!loginUid){

        $("studentName").textContent =
            "User UID not found";

        $("attendanceTableBody").innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    <div class="empty-icon">🔐</div>
                    <b>Firebase User UID nahi mila.</b>
                    <br><br>
                    Logout karke dobara login karein.
                </td>
            </tr>
        `;

        return;
    }

    /*
     * PRIMARY QUERY:
     * attendance.userUid == logged-in Firebase UID
     */
    let snap =
        await getDocs(
            query(
                collection(db,"attendance"),
                where("userUid","==",loginUid)
            )
        );

    attendanceRecords =
        snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

    /*
     * Existing old attendance records may have only studentId.
     * If no UID records exist yet, resolve the student and load
     * its old records as a compatibility fallback.
     */
    if(!attendanceRecords.length){

        const student =
            await resolveStudent();

        if(student){

            $("studentName").textContent =
                student.name ||
                student.studentName ||
                student.rollNo ||
                "Student";

            snap =
                await getDocs(
                    query(
                        collection(db,"attendance"),
                        where("studentId","==",student.id)
                    )
                );

            attendanceRecords =
                snap.docs.map(d=>({
                    id:d.id,
                    ...d.data()
                }));
        }
    }else{

        $("studentName").textContent =
            attendanceRecords[0]?.studentName ||
            "Student";
    }

    console.log(
        "ATTENDANCE BY USER UID:",
        loginUid,
        "Records:",
        attendanceRecords.length
    );

    renderAttendance();
}

/*
=====================================================
LOAD SUBJECTS
=====================================================
*/

async function loadSubjects(){

    const snap =
        await getDocs(
            collection(db,"subjects")
        );

    subjects =
        snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

    renderSubjectOptions();
}


function renderSubjectOptions(){

    const section =
        norm($("section").value);

    const semester =
        norm($("semester").value);

    const list =
        subjects.filter(subject=>{

            if(subject.active === false){
                return false;
            }

            const sSection =
                norm(subject.section);

            const sSemester =
                norm(subject.semester);

            return (
                (!sSection || sSection === section) &&
                (!sSemester || sSemester === semester)
            );
        });

    $("subject").innerHTML =
        `<option value="">All Subjects</option>`;

    list.forEach(subject=>{

        const option =
            document.createElement("option");

        option.value =
            subject.id;

        option.textContent =
            (subject.code ? subject.code+" — " : "") +
            (subject.name || "Unnamed Subject");

        $("subject").appendChild(option);
    });
}


/*
=====================================================
LOAD ATTENDANCE
=====================================================
*/

async function loadAttendance(){

    clearError();

    $("studentName").textContent = "Loading...";

    /*
     * Students are loaded first so we can resolve the logged-in
     * student even when localStorage contains username/rollNo
     * instead of the Firestore document ID.
     */
    if(!allStudents.length){
        await loadStudentsForAttendance();
    }

    const student =
        await resolveStudent();

    if(!student){

        $("studentName").textContent =
            "Student not found";

        $("attendanceTableBody").innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    <div class="empty-icon">👨‍🎓</div>
                    Student record nahi mila.
                    <br>
                    Login ke baad page refresh karein.
                </td>
            </tr>
        `;

        console.warn(
            "Student resolve failed. localStorage:",
            {...localStorage}
        );

        return;
    }

    $("studentName").textContent =
        student.name ||
        student.studentName ||
        student.rollNo ||
        "Student";


    console.log(
        "Loading attendance for:",
        student.id,
        student.name
    );


    /*
     * Query attendance by the exact student document ID
     * used by manage-attendance.html while saving.
     */
    const q =
        query(
            collection(db,"attendance"),
            where(
                "studentId",
                "==",
                student.id
            )
        );


    const snap =
        await getDocs(q);


    attendanceRecords =
        snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));


    console.log(
        "Attendance records:",
        attendanceRecords.length
    );


    renderAttendance();
}


/*
=====================================================
FILTER + RENDER
=====================================================
*/

function getFilteredRecords(){

    const month =
        $("month").value;

    const subjectId =
        $("subject").value;

    const semester =
        norm($("semester").value);

    const section =
        norm($("section").value);


    return attendanceRecords
        .filter(record=>{

            if(
                month &&
                !String(record.date || "")
                    .startsWith(month)
            ){
                return false;
            }

            if(
                subjectId &&
                String(record.subjectId) !==
                String(subjectId)
            ){
                return false;
            }

            if(
                record.section &&
                norm(record.section) !== section
            ){
                return false;
            }

            if(
                record.semester &&
                norm(record.semester) !== semester
            ){
                return false;
            }

            return true;
        })
        .sort((a,b)=>
            String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                )
        );
}


function renderAttendance(){

    const records =
        getFilteredRecords();


    const present =
        records.filter(
            r =>
                norm(r.status) === "p" ||
                norm(r.status) === "present"
        ).length;


    const total =
        records.length;


    const percentage =
        total
        ? Math.round((present / total) * 100)
        : 0;


    $("totalClasses").textContent =
        total;

    $("presentClasses").textContent =
        present;

    $("attendancePercent").textContent =
        percentage + "%";

    $("recordCount").textContent =
        total + " records";


    if(!records.length){

        $("attendanceTableBody").innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    <div class="empty-icon">📋</div>
                    No attendance records found.
                </td>
            </tr>
        `;

        return;
    }


    $("attendanceTableBody").innerHTML =
        records.map((record,index)=>{

            const isPresent =
                norm(record.status) === "p" ||
                norm(record.status) === "present";

            const statusText =
                isPresent
                ? "✓ Present"
                : "✕ Absent";

            const statusClass =
                isPresent
                ? "present"
                : "absent";


            return `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <b>
                            ${esc(record.date || "—")}
                        </b>
                    </td>

                    <td>
                        ${esc(
                            record.subjectCode
                            ? record.subjectCode +
                              " — " +
                              (record.subjectName || "")
                            : (
                                record.subjectName ||
                                "—"
                            )
                        )}
                    </td>

                    <td>
                        ${esc(
                            record.lectureType ||
                            "Theory"
                        )}
                    </td>

                    <td>
                        <span
                            class="badge ${statusClass}"
                        >
                            ${statusText}
                        </span>
                    </td>

                </tr>
            `;

        }).join("");


    /*
     * Show student name if available
     * in attendance records.
     */

    const first =
        records[0];

    if(first?.studentName){

        $("studentName").textContent =
            first.studentName;

    }
}


/*
=====================================================
FILTER EVENTS
=====================================================
*/

$("semester").addEventListener(
    "change",
    async ()=>{
        renderSubjectOptions();
        renderAttendance();
    }
);


$("section").addEventListener(
    "change",
    async ()=>{
        renderSubjectOptions();
        renderAttendance();
    }
);


$("subject").addEventListener(
    "change",
    ()=>{
        renderAttendance();
    }
);


$("month").addEventListener(
    "change",
    ()=>{
        renderAttendance();
    }
);


/*
=====================================================
REFRESH
=====================================================
*/

$("refreshBtn").addEventListener(
    "click",
    async ()=>{

        try{

            $("refreshBtn").disabled =
                true;

            await loadSubjects();
            await loadAttendance();

            showSuccess(
                "✓ Attendance refreshed."
            );

        }catch(error){

            showError(
                "Refresh failed: " +
                error.message
            );

        }finally{

            $("refreshBtn").disabled =
                false;

        }
    }
);


/*
=====================================================
INITIALIZE
=====================================================
*/

async function init(){

    try{

        $("month").value =
            getCurrentMonth();

        $("semester").value =
            "Sem-3";

        $("section").value =
            "A";


        await loadSubjects();

        await loadAttendance();


        console.log(
            "ATTENDANCE PAGE READY"
        );

    }catch(error){

        showError(
            "Attendance load error: " +
            error.message
        );
    }
}

init();

</script>

</body>
</html>
