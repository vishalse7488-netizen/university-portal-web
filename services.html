<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Services - University Portal</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

        }


        /* ================= NAVBAR ================= */

        .navbar {

            background: #007BFF;

            color: white;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: relative;

            min-height: 60px;

        }


        .navbar h1 {

            font-size: 18px;

            margin: 0;

            max-width: 40%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .center-title {

            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            font-size: 22px;

            font-weight: bold;

            white-space: nowrap;

        }


        .logout {

            color: white;

            text-decoration: none;

            background: #dc3545;

            padding: 8px 15px;

            border-radius: 5px;

            transition: 0.3s;

        }


        .logout:hover {

            background: #c82333;

        }



        /* ================= MENU BAR ================= */

        .menu-bar {

            background: #0056b3;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 10px;

            gap: 30px;

            flex-wrap: wrap;

        }


        .menu-bar a {

            color: white;

            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;

        }


        .menu-bar a:hover {

            color: #FFD700;

            text-decoration: underline;

        }


        .menu-bar a.active {

            color: #FFD700;

            font-weight: bold;

        }



        /* ================= MAIN CONTENT ================= */

        .content {

            max-width: 900px;

            width: calc(100% - 30px);

            margin: 40px auto;

            text-align: center;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.1);

        }


        .content h2 {

            color: #333;

            margin-bottom: 10px;

            font-size: 28px;

        }


        .content-description {

            color: #666;

            margin-bottom: 25px;

            font-size: 15px;

        }



        /* ================= SERVICES GRID ================= */

        .services-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 20px;

        }


        .service-card {

            background: #007BFF;

            color: white;

            padding: 25px 15px;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;

            min-height: 110px;

            display: flex;

            justify-content: center;

            align-items: center;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.08);

        }


        .service-card:hover {

            background: #0056b3;

            transform:
                translateY(-5px);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, 0.15);

        }


        .service-card a {

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: 600;

            display: block;

            width: 100%;

        }


        .service-icon {

            font-size: 30px;

            display: block;

            margin-bottom: 8px;

        }



        /* ================= BACK BUTTON ================= */

        .btn-back {

            display: inline-block;

            margin-top: 30px;

            text-decoration: none;

            background: #28a745;

            color: white;

            padding: 10px 20px;

            border-radius: 6px;

            transition: 0.3s;

        }


        .btn-back:hover {

            background: #218838;

            transform:
                translateY(-2px);

        }



        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 12px 10px;

            }


            .navbar h1 {

                font-size: 12px;

                max-width: 35%;

            }


            .center-title {

                font-size: 17px;

            }


            .logout {

                padding: 7px 10px;

                font-size: 12px;

            }


            .menu-bar {

                flex-direction: column;

                gap: 10px;

            }


            .content {

                margin: 20px auto;

                padding: 20px 15px;

            }


            .content h2 {

                font-size: 23px;

            }


            .services-grid {

                grid-template-columns:
                    1fr 1fr;

                gap: 12px;

            }


            .service-card {

                min-height: 100px;

                padding: 15px 8px;

            }


            .service-card a {

                font-size: 14px;

            }


            .service-icon {

                font-size: 25px;

            }

        }


        @media (max-width: 350px) {

            .services-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>
