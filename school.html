<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Page - Notice Board</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            background: #f4f6f8;

        }


        /* =========================
           TOP NAVBAR
        ========================= */

        .navbar {

            background: #007BFF;

            color: white;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: relative;

            min-height: 60px;

        }


        .navbar h1 {

            font-size: 18px;

            margin: 0;

            max-width: 40%;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .center-title {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-size: 22px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .logout {

            color: white;

            text-decoration: none;

            background: #dc3545;

            padding: 8px 15px;

            border-radius: 5px;

            transition: 0.3s;

            cursor: pointer;

        }


        .logout:hover {

            background: #c82333;

        }


        /* =========================
           SECONDARY MENU
        ========================= */

        .menu-bar {

            background: #0056b3;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 10px 15px;

            gap: 30px;

        }


        .menu-bar a {

            color: white;

            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;

        }


        .menu-bar a:hover {

            color: #FFD700;

            text-decoration: underline;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: calc(100% - 30px);

            max-width: 1000px;

            margin: 40px auto;

            background: white;

            padding: 25px;

            border-radius: 8px;

            box-shadow:
                0 6px 18px
                rgba(0,0,0,0.08);

        }


        /* =========================
           SCHOOL HEADER
        ========================= */

        .school-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .school-header h2 {

            margin: 0;

            color: #333;

        }


        /* =========================
           BUTTONS
        ========================= */

        .btn {

            display: inline-block;

            background: #007BFF;

            color: white;

            padding: 8px 14px;

            border-radius: 6px;

            text-decoration: none;

            border: none;

            cursor: pointer;

            transition: 0.3s;

        }


        .btn:hover {

            background: #005bb5;

        }


        .btn-danger {

            background: #dc3545;

            margin-left: 8px;

        }


        .btn-danger:hover {

            background: #c82333;

        }


        /* =========================
           NOTICES
        ========================= */

        .notices {

            margin-top: 20px;

        }


        .notice {

            border-left: 4px solid #007BFF;

            padding: 12px 16px;

            background: #fbfdff;

            margin-bottom: 12px;

            border-radius: 4px;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.04);

        }


        .notice strong {

            color: #222;

            font-size: 17px;

        }


        .notice em {

            color: #007BFF;

            font-style: normal;

            font-weight: 500;

        }


        .loading {

            text-align: center;

            padding: 20px;

            color: #555;

        }


        .no-notice {

            text-align: center;

            padding: 25px;

            color: #777;

            background: #f8f9fa;

            border-radius: 8px;

        }


        .error-message {

            text-align: center;

            padding: 15px;

            color: #dc3545;

            background: #fff0f0;

            border-radius: 8px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 12px 15px;

            }


            .navbar h1 {

                font-size: 14px;

                max-width: 45%;

            }


            .center-title {

                font-size: 18px;

            }


            .logout {

                padding: 7px 10px;

                font-size: 13px;

            }


            .menu-bar {

                flex-direction: column;

                gap: 10px;

                padding: 12px;

            }


            .menu-bar a {

                font-size: 14px;

            }


            .container {

                margin: 20px auto;

                padding: 18px;

            }


            .school-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .school-header h2 {

                font-size: 22px;

            }


            .btn {

                font-size: 14px;

                padding: 8px 11px;

            }

        }


        @media (max-width: 450px) {

            .navbar {

                flex-wrap: wrap;

                gap: 10px;

            }


            .navbar h1 {

                max-width: 60%;

            }


            .center-title {

                position: static;

                transform: none;

                width: 100%;

                text-align: center;

                order: 3;

                font-size: 18px;

                margin-top: 5px;

            }


            .navbar .logout {

                margin-left: auto;

            }


            .container {

                width: calc(100% - 20px);

                padding: 15px;

            }


            .school-header > div {

                width: 100%;

            }


            .school-header .btn {

                display: block;

                text-align: center;

                width: 100%;

                margin: 5px 0 !important;

            }


            .notice {

                font-size: 14px;

                line-height: 1.5;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP NAVBAR
    ========================= -->

    <div class="navbar">

        <h1 id="welcomeText">
            Welcome 👋
        </h1>


        <div class="center-title">
            Notice Board
        </div>


        <a
            href="#"
            class="logout"
            id="logoutButton"
        >
            Logout
        </a>

    </div>


    <!-- =========================
         MENU BAR
    ========================= -->

    <div class="menu-bar">

        <a href="dashboard.html">
            Menu
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="about.html">
            About
        </a>

        <a href="location.html">
            Location
        </a>

        <a href="feedback.html">
            Feedback
        </a>

        <a href="contact.html">
            Contact Us
        </a>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">


        <div class="school-header">

            <h2>
                School Page
            </h2>


            <div>

                <a
                    href="dashboard.html"
                    class="btn"
                >
                    Back to Dashboard
                </a>


                <a
                    href="#"
                    class="btn btn-danger"
                    id="logoutButton2"
                >
                    Logout
                </a>

            </div>

        </div>


        <p style="color:#555; margin-top:12px;">

            Welcome to the school section.
            Below are the latest notices / announcements.

        </p>


        <!-- =========================
             FIRESTORE NOTICES
        ========================= -->

        <div
            class="notices"
            id="noticesContainer"
        >

            <div class="loading">
                Loading notices...
            </div>

        </div>


    </div>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">


        /* =====================================
           FIREBASE SDK
        ===================================== */

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            query,
            orderBy
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(firebaseConfig);


        /* =====================================
           AUTHENTICATION
        ===================================== */

        const auth =
            getAuth(app);


        /* =====================================
           FIRESTORE
        ===================================== */

        const db =
            getFirestore(app);


        /* =====================================
           HTML ELEMENTS
        ===================================== */

        const welcomeText =
            document.getElementById("welcomeText");


        const noticesContainer =
            document.getElementById("noticesContainer");


        const logoutButton =
            document.getElementById("logoutButton");


        const logoutButton2 =
            document.getElementById("logoutButton2");


        /* =====================================
           CHECK LOGIN
        ===================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    // User login nahi hai

                    window.location.href =
                        "login.html";

                    return;

                }


                // Logged-in user's email

                const email =
                    user.email || "User";


                welcomeText.textContent =
                    "Welcome, " +
                    email +
                    " 👋";


                // Firestore se notices load

                loadNotices();

            }
        );


        /* =====================================
           LOAD NOTICES FROM FIRESTORE
        ===================================== */

        async function loadNotices() {

            try {


                noticesContainer.innerHTML = `

                    <div class="loading">
                        Loading notices...
                    </div>

                `;


                /*
                 * Firestore collection:
                 *
                 * school_notices
                 */

                const noticesRef =
                    collection(
                        db,
                        "school_notices"
                    );


                /*
                 * Newest notice first
                 */

                const noticesQuery =
                    query(
                        noticesRef,
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );


                const snapshot =
                    await getDocs(
                        noticesQuery
                    );


                /* =========================
                   NO NOTICES
                ========================= */

                if (snapshot.empty) {

                    noticesContainer.innerHTML = `

                        <div class="no-notice">

                            📢 No notices available.

                        </div>

                    `;

                    return;

                }


                /* =========================
                   CLEAR LOADING
                ========================= */

                noticesContainer.innerHTML = "";


                /* =========================
                   DISPLAY NOTICES
                ========================= */

                snapshot.forEach(
                    (docSnapshot) => {

                        const data =
                            docSnapshot.data();


                        const title =
                            data.title ||
                            "Notice";


                        const message =
                            data.message ||
                            "";


                        const date =
                            data.date ||
                            "";


                        const notice =
                            document.createElement(
                                "div"
                            );


                        notice.className =
                            "notice";


                        notice.innerHTML = `

                            <strong>
                                ${escapeHTML(title)}
                            </strong>

                            <br>

                            ${escapeHTML(message)}

                            ${
                                date
                                ?
                                `<br>
                                 <em>
                                    ${escapeHTML(date)}
                                 </em>`
                                :
                                ""
                            }

                        `;


                        noticesContainer.appendChild(
                            notice
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Firestore Error:",
                    error
                );


                noticesContainer.innerHTML = `

                    <div class="error-message">

                        ❌ Notices load nahi ho paaye.

                        <br><br>

                        ${escapeHTML(error.message)}

                    </div>

                `;

            }

        }


        /* =====================================
           HTML SECURITY
        ===================================== */

        function escapeHTML(text) {

            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           LOGOUT
        ===================================== */

        async function logout() {

            try {

                await signOut(auth);

                window.location.href =
                    "login.html";

            } catch (error) {

                console.error(
                    "Logout Error:",
                    error
                );

                alert(
                    "Logout failed. Please try again."
                );

            }

        }


        logoutButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                logout();

            }
        );


        logoutButton2.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                logout();

            }
        );


    </script>


</body>

</html>
