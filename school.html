<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Page - Notice Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        /* NAVBAR */
        .navbar {
            background: #007BFF;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .navbar h1 {
            font-size: 18px;
            margin: 0;
        }

        .center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .logout:hover {
            background: #c82333;
        }

        /* MENU */
        .menu-bar {
            background: #0056b3;
            display: flex;
            justify-content: center;
            padding: 10px;
            gap: 30px;
            flex-wrap: wrap;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .menu-bar a:hover {
            color: #FFD700;
            text-decoration: underline;
        }

        /* CONTAINER */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .school-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .school-header h2 {
            margin: 0;
            color: #333;
        }

        .btn {
            display: inline-block;
            background: #007BFF;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
        }

        .btn:hover {
            background: #005bb5;
        }

        /* NOTICE */
        .notices {
            margin-top: 20px;
        }

        .notice {
            border-left: 4px solid #007BFF;
            padding: 15px 16px;
            background: #fbfdff;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .notice h3 {
            margin: 0 0 8px;
            color: #222;
        }

        .notice p {
            margin: 5px 0;
            color: #555;
        }

        .notice-date {
            font-size: 13px;
            color: #777;
            margin-top: 8px;
        }

        /* LOADING */
        #loading {
            text-align: center;
            padding: 25px;
            color: #555;
        }

        /* ERROR */
        #error {
            display: none;
            background: #ffe5e5;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        /* EMPTY */
        #empty {
            display: none;
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .navbar {
                padding: 12px;
            }

            .navbar h1 {
                font-size: 13px;
                max-width: 40%;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .center-title {
                font-size: 18px;
            }

            .logout {
                padding: 7px 10px;
                font-size: 13px;
            }

            .menu-bar {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .container {
                margin: 20px 12px;
                padding: 18px;
            }

            .school-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <h1 id="welcomeUser">
        Welcome 👋
    </h1>

    <div class="center-title">
        Notice Board
    </div>

    <a href="login.html" class="logout" onclick="logout()">
        Logout
    </a>

</div>


<!-- MENU -->
<div class="menu-bar">

    <a href="dashboard.html">Dashboard</a>

    <a href="menu.html">Menu</a>

    <a href="services.html">Services</a>

    <a href="about.html">About</a>

    <a href="location.html">Location</a>

    <a href="feedback.html">Feedback</a>

    <a href="contact.html">Contact Us</a>

</div>


<!-- MAIN -->
<div class="container">

    <div class="school-header">

        <h2>
            School Page
        </h2>

        <a href="dashboard.html" class="btn">
            Back to Dashboard
        </a>

    </div>


    <p style="color:#555; margin-top:12px;">
        Welcome to the school section. Below are the latest notices / announcements.
    </p>


    <!-- ERROR -->
    <div id="error"></div>


    <!-- LOADING -->
    <div id="loading">
        🔄 Loading notices...
    </div>


    <!-- EMPTY -->
    <div id="empty">
        📢 No notices available.
    </div>


    <!-- FIREBASE NOTICES -->
    <div id="notices" class="notices"></div>

</div>


<!-- FIREBASE -->
<script type="module">

    /* =====================================
       FIREBASE IMPORT
    ===================================== */

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        getDocs
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================
       FIREBASE CONFIG
    ===================================== */

    const firebaseConfig = {

        apiKey: "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

        authDomain:
            "university-portal-2107e.firebaseapp.com",

        projectId:
            "university-portal-2107e",

        storageBucket:
            "university-portal-2107e.firebasestorage.app",

        messagingSenderId:
            "50848903813",

        appId:
            "1:50848903813:web:8296090d0d9268cfd2efec",

        measurementId:
            "G-LKTX7C7F0E"
    };


    /* =====================================
       INITIALIZE FIREBASE
    ===================================== */

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* =====================================
       USER EMAIL
    ===================================== */

    const userEmail =
        localStorage.getItem("userEmail");

    if (userEmail) {

        document.getElementById("welcomeUser").textContent =
            "Welcome, " + userEmail + " 👋";

    }


    /* =====================================
       LOAD NOTICES
    ===================================== */

    async function loadNotices() {

        const loading =
            document.getElementById("loading");

        const noticesDiv =
            document.getElementById("notices");

        const empty =
            document.getElementById("empty");

        const error =
            document.getElementById("error");


        try {

            console.log("Connecting to Firestore...");


            /*
             IMPORTANT:

             Aapke Firebase screenshot me collection ka naam:

             school notice

             Isliye yahi exact naam use kiya hai.
            */

            const querySnapshot =
                await getDocs(
                    collection(db, "school notice")
                );


            console.log(
                "Documents found:",
                querySnapshot.size
            );


            loading.style.display = "none";


            /* NO DATA */

            if (querySnapshot.empty) {

                empty.style.display = "block";

                return;
            }


            /* CLEAR */

            noticesDiv.innerHTML = "";


            /* LOOP */

            querySnapshot.forEach((doc) => {

                const data = doc.data();

                console.log(
                    "Notice:",
                    data
                );


                const title =
                    data.title || "Notice";


                const message =
                    data.message || "";


                const date =
                    data.date || "";


                const notice =
                    document.createElement("div");

                notice.className =
                    "notice";


                notice.innerHTML = `

                    <h3>
                        ${escapeHTML(title)}
                    </h3>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    ${
                        date
                        ?
                        `<div class="notice-date">
                            📅 ${escapeHTML(date)}
                        </div>`
                        :
                        ""
                    }

                `;


                noticesDiv.appendChild(notice);

            });

        }

        catch (err) {

            console.error(
                "Firestore Error:",
                err
            );


            loading.style.display =
                "none";


            error.style.display =
                "block";


            error.innerHTML =
                "❌ Notice load nahi ho pa raha hai.<br><br>" +
                "<b>Error:</b> " +
                escapeHTML(err.message);

        }

    }


    /* =====================================
       SECURITY - HTML ESCAPE
    ===================================== */

    function escapeHTML(text) {

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================
       LOGOUT
    ===================================== */

    window.logout = function() {

        localStorage.removeItem("userEmail");

    };


    /* =====================================
       START
    ===================================== */

    loadNotices();

</script>

</body>
</html>
