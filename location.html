<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Location - Rama University</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #007BFF;
            color: white;
            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: relative;
        }

        .navbar h1 {
            font-size: 18px;
            margin: 0;

            max-width: 40%;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .center-title {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            font-size: 22px;
            font-weight: bold;

            white-space: nowrap;
        }

        .logout {
            color: white;

            background: #dc3545;

            padding: 8px 15px;

            border-radius: 5px;

            cursor: pointer;

            border: none;

            font-size: 15px;
        }

        .logout:hover {
            background: #c82333;
        }


        /* ================= MENU ================= */

        .menu-bar {

            background: #0056b3;

            display: flex;

            justify-content: center;

            padding: 10px 0;

            gap: 30px;

            flex-wrap: wrap;
        }

        .menu-bar a {

            color: white;

            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;
        }

        .menu-bar a:hover {

            color: #FFD700;

            text-decoration: underline;
        }


        /* ================= CONTENT ================= */

        .content {

            max-width: 900px;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .content h2 {

            color: #007BFF;

            margin-bottom: 20px;
        }

        .description {

            color: #555;

            margin-bottom: 20px;

            line-height: 1.6;
        }


        /* ================= LOCATION INFO ================= */

        .location-info {

            background: #f8fbff;

            border-left:
                5px solid #007BFF;

            padding: 15px;

            margin-bottom: 20px;

            border-radius: 6px;

            text-align: left;
        }

        .location-info p {

            margin: 8px 0;

            color: #333;

            line-height: 1.5;
        }


        /* ================= MAP ================= */

        .map-container {

            width: 100%;

            overflow: hidden;

            border-radius: 10px;

            background: #eee;
        }

        iframe {

            display: block;

            width: 100%;

            height: 400px;

            border: none;

            border-radius: 10px;
        }


        /* ================= MAP BUTTON ================= */

        .map-button {

            display: inline-block;

            margin-top: 15px;

            background: #007BFF;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-size: 15px;
        }

        .map-button:hover {

            background: #0056b3;
        }


        /* ================= LOADING ================= */

        #loading {

            color: #007BFF;

            padding: 20px;

            font-size: 16px;
        }


        /* ================= ERROR ================= */

        #errorMessage {

            display: none;

            color: #dc3545;

            padding: 15px;

            margin-bottom: 15px;
        }


        /* ================= BACK BUTTON ================= */

        .btn-back {

            display: inline-block;

            margin-top: 25px;

            text-decoration: none;

            background: #28a745;

            color: white;

            padding: 10px 20px;

            border-radius: 6px;
        }

        .btn-back:hover {

            background: #218838;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 12px 10px;
            }

            .navbar h1 {

                font-size: 13px;

                max-width: 35%;
            }

            .center-title {

                font-size: 17px;
            }

            .logout {

                padding: 7px 10px;

                font-size: 13px;
            }

            .menu-bar {

                gap: 10px;

                padding: 12px 8px;
            }

            .menu-bar a {

                font-size: 14px;
            }

            .content {

                margin: 20px 10px;

                padding: 20px 15px;
            }

            .content h2 {

                font-size: 22px;
            }

            .description {

                font-size: 14px;
            }

            iframe {

                height: 300px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <h1 id="welcomeUser">
            Welcome 👋
        </h1>

        <div class="center-title">
            University Portal
        </div>

        <button
            id="logoutBtn"
            class="logout">

            Logout

        </button>

    </div>


    <!-- ================= MENU ================= -->

    <div class="menu-bar">

        <a href="dashboard.html">
            Menu
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="about.html">
            About
        </a>

        <a href="location.html">
            Location
        </a>

        <a href="feedback.html">
            Feedback
        </a>

        <a href="contact.html">
            Contact Us
        </a>

    </div>


    <!-- ================= CONTENT ================= -->

    <div class="content">

        <h2>
            📍 Our University Location
        </h2>


        <p class="description">

            Find Rama University easily on the map below.

        </p>


        <!-- LOADING -->

        <div id="loading">

            Loading location...

        </div>


        <!-- ERROR -->

        <p id="errorMessage"></p>


        <!-- LOCATION -->

        <div
            id="locationContent"
            style="display:none;">


            <!-- ADDRESS -->

            <div class="location-info">

                <p>

                    📍

                    <strong>
                        Address:
                    </strong>

                    <span id="address">
                    </span>

                </p>

            </div>


            <!-- MAP -->

            <div class="map-container">

                <iframe
                    id="mapFrame"
                    title="Rama University Location"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>


            <!-- OPEN GOOGLE MAP -->

            <a
                id="openMap"
                class="map-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer">

                📍 Open in Google Maps

            </a>


        </div>


        <!-- BACK -->

        <a
            href="dashboard.html"
            class="btn-back">

            ⬅ Back to Dashboard

        </a>

    </div>



    <!-- ================= FIREBASE ================= -->

    <script type="module">


        /* =========================================
           FIREBASE IMPORT
        ========================================= */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



        /* =========================================
           FIREBASE CONFIG
        ========================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"
        };



        /* =========================================
           INITIALIZE FIREBASE
        ========================================= */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* =========================================
           HTML ELEMENTS
        ========================================= */

        const welcomeUser =
            document.getElementById(
                "welcomeUser"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const locationContent =
            document.getElementById(
                "locationContent"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        const address =
            document.getElementById(
                "address"
            );


        const mapFrame =
            document.getElementById(
                "mapFrame"
            );


        const openMap =
            document.getElementById(
                "openMap"
            );



        /* =========================================
           DEFAULT RAMA UNIVERSITY DATA
        ========================================= */

        const defaultAddress =
            "NH-91, Rama City, Mandhana, Kanpur, Uttar Pradesh - 209217, India";


        /*
           This is an EMBED URL.
           Do NOT put /maps/search/ URL here.
        */

        const defaultMapUrl =
            "https://www.google.com/maps?q=Rama+University,+Rama+City,+Mandhana,+Kanpur,+Uttar+Pradesh+209217&output=embed";


        /*
           Normal clickable Google Maps URL
        */

        const defaultGoogleMapsUrl =
            "https://www.google.com/maps/search/?api=1&query=Rama+University,+Rama+City,+Mandhana,+Kanpur,+Uttar+Pradesh+209217";



        /* =========================================
           AUTHENTICATION CHECK
        ========================================= */

        onAuthStateChanged(
            auth,
            async (user) => {


                /* NOT LOGGED IN */

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;
                }


                /* USER EMAIL */

                const email =
                    user.email || "User";


                welcomeUser.textContent =
                    "Welcome, " +
                    email +
                    " 👋";


                /* LOAD FIRESTORE */

                await loadLocation();

            }
        );



        /* =========================================
           LOAD LOCATION FROM FIRESTORE
        ========================================= */

        async function loadLocation() {

            try {


                /*
                    FIRESTORE:

                    locations
                       └── main
                            ├── address
                            └── mapUrl
                */


                const locationRef =
                    doc(
                        db,
                        "locations",
                        "main"
                    );


                const locationSnap =
                    await getDoc(
                        locationRef
                    );



                /* =================================
                   DOCUMENT EXISTS
                ================================= */

                if (
                    locationSnap.exists()
                ) {


                    const data =
                        locationSnap.data();



                    /* ADDRESS */

                    const firebaseAddress =
                        data.address ||
                        defaultAddress;


                    address.textContent =
                        firebaseAddress;



                    /* MAP URL */

                    const firebaseMapUrl =
                        data.mapUrl ||
                        defaultMapUrl;


                    mapFrame.src =
                        firebaseMapUrl;



                    /* OPEN GOOGLE MAP */

                    openMap.href =
                        defaultGoogleMapsUrl;

                }



                /* =================================
                   DOCUMENT DOES NOT EXIST
                ================================= */

                else {

                    address.textContent =
                        defaultAddress;


                    mapFrame.src =
                        defaultMapUrl;


                    openMap.href =
                        defaultGoogleMapsUrl;

                }



                /* SHOW CONTENT */

                loading.style.display =
                    "none";


                locationContent.style.display =
                    "block";

            }



            catch (error) {


                console.error(
                    "Firestore Location Error:",
                    error
                );


                loading.style.display =
                    "none";


                errorMessage.style.display =
                    "block";


                errorMessage.textContent =
                    "Firebase se location load nahi ho paayi. Default location show ki ja rahi hai.";


                /* DEFAULT DATA */

                address.textContent =
                    defaultAddress;


                mapFrame.src =
                    defaultMapUrl;


                openMap.href =
                    defaultGoogleMapsUrl;


                locationContent.style.display =
                    "block";

            }

        }



        /* =========================================
           LOGOUT
        ========================================= */

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {


                    await signOut(auth);


                    window.location.href =
                        "login.html";

                }


                catch (error) {


                    console.error(
                        "Logout Error:",
                        error
                    );


                    alert(
                        "Logout failed. Please try again."
                    );

                }

            }
        );


    </script>

</body>

</html>
