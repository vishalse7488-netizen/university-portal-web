<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location - Sunrise Public School</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #007BFF;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .navbar h1 {
            font-size: 18px;
            margin: 0;
            max-width: 40%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-size: 15px;
        }

        .logout:hover {
            background: #c82333;
        }

        /* ================= MENU ================= */

        .menu-bar {
            background: #0056b3;
            display: flex;
            justify-content: center;
            padding: 10px 0;
            gap: 30px;
            flex-wrap: wrap;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .menu-bar a:hover {
            color: #FFD700;
            text-decoration: underline;
        }

        /* ================= CONTENT ================= */

        .content {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .content h2 {
            color: #007BFF;
            margin-bottom: 20px;
        }

        .description {
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* ================= LOCATION INFO ================= */

        .location-info {
            background: #f8fbff;
            border-left: 5px solid #007BFF;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: left;
        }

        .location-info p {
            margin: 8px 0;
            color: #333;
        }

        /* ================= MAP ================= */

        .map-container {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 10px;
        }

        /* ================= LOADING ================= */

        #loading {
            color: #007BFF;
            padding: 20px;
            font-size: 16px;
        }

        #errorMessage {
            display: none;
            color: #dc3545;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* ================= BUTTON ================= */

        .btn-back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
        }

        .btn-back:hover {
            background: #218838;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 12px 10px;
            }

            .navbar h1 {
                font-size: 13px;
                max-width: 35%;
            }

            .center-title {
                font-size: 17px;
            }

            .logout {
                padding: 7px 10px;
                font-size: 13px;
            }

            .menu-bar {
                gap: 10px;
                padding: 12px 8px;
            }

            .menu-bar a {
                font-size: 14px;
            }

            .content {
                margin: 20px 10px;
                padding: 20px 15px;
            }

            .content h2 {
                font-size: 22px;
            }

            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <h1 id="welcomeUser">
            Welcome 👋
        </h1>

        <div class="center-title">
            University Portal
        </div>

        <button id="logoutBtn" class="logout">
            Logout
        </button>

    </div>


    <!-- ================= MENU ================= -->

    <div class="menu-bar">

        <a href="dashboard.html">
            Menu
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="about.html">
            About
        </a>

        <a href="location.html">
            Location
        </a>

        <a href="feedback.html">
            Feedback
        </a>

        <a href="contact.html">
            Contact Us
        </a>

    </div>


    <!-- ================= LOCATION CONTENT ================= -->

    <div class="content">

        <h2>
            📍 Our School Location
        </h2>

        <p class="description">
            Find us easily on the map below — we are always happy to welcome visitors!
        </p>


        <!-- Loading -->

        <div id="loading">
            Loading location...
        </div>


        <!-- Error -->

        <p id="errorMessage"></p>


        <!-- Location Data -->

        <div id="locationContent" style="display:none;">

            <div class="location-info">

                <p>
                    📍 <strong>Address:</strong>
                    <span id="address"></span>
                </p>

            </div>


            <!-- Google Map -->

            <div class="map-container">

                <iframe
                    id="mapFrame"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

        </div>


        <a href="dashboard.html" class="btn-back">
            ⬅ Back to Dashboard
        </a>

    </div>


    <!-- ================= FIREBASE ================= -->

    <script type="module">

        /* ================= FIREBASE IMPORTS ================= */

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* ================= FIREBASE CONFIG ================= */

        const firebaseConfig = {

            apiKey: "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"
        };


        /* ================= INITIALIZE FIREBASE ================= */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        /* ================= ELEMENTS ================= */

        const welcomeUser =
            document.getElementById("welcomeUser");

        const loading =
            document.getElementById("loading");

        const locationContent =
            document.getElementById("locationContent");

        const errorMessage =
            document.getElementById("errorMessage");

        const logoutBtn =
            document.getElementById("logoutBtn");

        const address =
            document.getElementById("address");

        const mapFrame =
            document.getElementById("mapFrame");


        /* ================= AUTH CHECK ================= */

        onAuthStateChanged(auth, async (user) => {

            /*
                Agar user login nahi hai
                to login page par bhej do
            */

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            /* ================= USER EMAIL ================= */

            const email =
                user.email || "User";

            welcomeUser.textContent =
                "Welcome, " + email + " 👋";


            /* ================= LOAD LOCATION ================= */

            await loadLocation();

        });


        /* ================= LOAD FIRESTORE LOCATION ================= */

        async function loadLocation() {

            try {

                /*
                    Firestore Structure:

                    locations
                       └── main
                            ├── address
                            └── mapUrl
                */


                const locationRef =
                    doc(db, "locations", "main");


                const locationSnap =
                    await getDoc(locationRef);


                if (locationSnap.exists()) {

                    const data =
                        locationSnap.data();


                    /* ================= ADDRESS ================= */

                    address.textContent =
                        data.address ||
                        "Address not available";


                    /* ================= MAP ================= */

                    if (data.mapUrl) {

                        mapFrame.src =
                            data.mapUrl;

                    } else {

                        /*
                            Agar mapUrl Firebase me nahi hai
                            to default Google Map
                        */

                        mapFrame.src =
                            "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.635901073871!2d80.94616657460293!3d26.848850363187!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399be2d6a1234567%3A0xabcdef123456789!2sSunrise%20Public%20School%2C%20Lucknow!5e0!3m2!1sen!2sin!4v1698637440000!5m2!1sen!2sin";
                    }

                }


                else {

                    /*
                        Agar Firebase document nahi mila
                    */

                    address.textContent =
                        "Sunrise Public School, Green Valley Road, Lucknow, India";


                    mapFrame.src =
                        "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.635901073871!2d80.94616657460293!3d26.848850363187!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399be2d6a1234567%3A0xabcdef123456789!2sSunrise%20Public%20School%2C%20Lucknow!5e0!3m2!1sen!2sin!4v1698637440000!5m2!1sen!2sin";
                }


                /* ================= SHOW CONTENT ================= */

                loading.style.display =
                    "none";

                locationContent.style.display =
                    "block";

            }


            catch (error) {

                console.error(
                    "Firestore Error:",
                    error
                );


                loading.style.display =
                    "none";

                errorMessage.style.display =
                    "block";

                errorMessage.textContent =
                    "Location load nahi ho paayi. Please try again.";


                /*
                    Error ke case me default location
                */

                address.textContent =
                    "Sunrise Public School, Green Valley Road, Lucknow, India";


                mapFrame.src =
                    "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.635901073871!2d80.94616657460293!3d26.848850363187!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399be2d6a1234567%3A0xabcdef123456789!2sSunrise%20Public%20School%2C%20Lucknow!5e0!3m2!1sen!2sin!4v1698637440000!5m2!1sen!2sin";


                locationContent.style.display =
                    "block";
            }

        }


        /* ================= LOGOUT ================= */

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Logout Error:",
                        error
                    );

                    alert(
                        "Logout failed. Please try again."
                    );
                }

            }
        );

    </script>

</body>
</html>
