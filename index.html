<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>University Portal - Login</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                linear-gradient(
                    120deg,
                    #89f7fe,
                    #66a6ff
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .login-container {

            background: white;

            padding: 40px 30px;

            border-radius: 14px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.20);

            text-align: center;

            width: 100%;

            max-width: 380px;

        }


        .logo {

            width: 70px;

            height: 70px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            background: #4CAF50;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            font-weight: bold;

        }


        .login-container h2 {

            color: #333;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .input-box {

            width: 100%;

            padding:
                13px 14px;

            margin-bottom: 15px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        .input-box:focus {

            border-color: #4CAF50;

            box-shadow:
                0 0 5px
                rgba(
                    76,
                    175,
                    80,
                    0.25
                );

        }


        button {

            width: 100%;

            padding: 13px 15px;

            background: #4CAF50;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition: 0.3s;

        }


        button:hover {

            background: #43A047;

        }


        button:disabled {

            background: #9E9E9E;

            cursor: not-allowed;

        }


        .forgot-password {

            display: block;

            margin-top: 14px;

            font-size: 13px;

            color: #1976D2;

            text-decoration: none;

            cursor: pointer;

        }


        .forgot-password:hover {

            text-decoration: underline;

        }


        .register-text {

            margin-top: 20px;

            font-size: 14px;

            color: #555;

        }


        .register-text a {

            color: #4CAF50;

            text-decoration: none;

            font-weight: 600;

        }


        .register-text a:hover {

            text-decoration: underline;

        }


        #message {

            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;

            font-weight: 500;

            line-height: 1.4;

        }


        .error {

            color: #D32F2F;

        }


        .success {

            color: #2E7D32;

        }


        .loading {

            color: #1976D2;

        }


        @media (max-width: 400px) {

            body {

                padding: 12px;

            }


            .login-container {

                padding:
                    30px 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOGIN CONTAINER
    ========================================== -->

    <div class="login-container">


        <div class="logo">
            U
        </div>


        <h2>
            University Portal
        </h2>


        <p class="subtitle">
            Login to continue
        </p>


        <!-- =====================================
             LOGIN FORM
        ====================================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <input
                type="email"
                id="email"
                class="input-box"
                placeholder="Email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="password"
                class="input-box"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- =====================================
             FORGOT PASSWORD
        ====================================== -->

        <a
            href="#"
            class="forgot-password"
            id="forgotPassword"
        >
            Forgot Password?
        </a>


        <!-- =====================================
             REGISTER
        ====================================== -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <p id="message"></p>


    </div>


    <!-- =========================================
         FIREBASE JAVASCRIPT
    ========================================== -->

    <script type="module">


        /* =========================================
           FIREBASE APP
        ========================================== */

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        /* =========================================
           FIREBASE AUTH
        ========================================== */

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /* =========================================
           FIRESTORE
        ========================================== */

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* =========================================
           FIREBASE CONFIG
        ========================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"

        };


        /* =========================================
           INITIALIZE FIREBASE
        ========================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        /* =========================================
           INITIALIZE AUTH
        ========================================== */

        const auth =
            getAuth(app);


        /* =========================================
           INITIALIZE FIRESTORE
        ========================================== */

        const db =
            getFirestore(app);


        /* =========================================
           GET HTML ELEMENTS
        ========================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const forgotPassword =
            document.getElementById(
                "forgotPassword"
            );


        /* =========================================
           LOGIN
        ========================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /* =====================================
                   GET INPUT
                ====================================== */

                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                /* =====================================
                   VALIDATION
                ====================================== */

                if (
                    email === "" ||
                    password === ""
                ) {

                    showMessage(
                        "⚠️ Please fill all fields.",
                        "error"
                    );

                    return;

                }


                /* =====================================
                   DISABLE LOGIN BUTTON
                ====================================== */

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                showMessage(
                    "Checking your account...",
                    "loading"
                );


                try {


                    /* =================================
                       STEP 1
                       FIREBASE AUTHENTICATION
                    ================================= */

                    const userCredential =
                        await
                        signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    console.log(
                        "Firebase Auth Success:",
                        user.uid
                    );


                    /* =================================
                       STEP 2
                       FIRESTORE USERS COLLECTION
                    ================================= */

                    const usersRef =
                        collection(
                            db,
                            "users"
                        );


                    /* =================================
                       STEP 3
                       FIND USER BY EMAIL
                    ================================= */

                    const userQuery =
                        query(
                            usersRef,
                            where(
                                "email",
                                "==",
                                user.email
                            )
                        );


                    const snapshot =
                        await getDocs(
                            userQuery
                        );


                    /* =================================
                       USER PROFILE NOT FOUND
                    ================================= */

                    if (
                        snapshot.empty
                    ) {

                        await auth.signOut();


                        showMessage(
                            "❌ User profile not found in Firestore.",
                            "error"
                        );


                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";


                        return;

                    }


                    /* =================================
                       STEP 4
                       GET FIRESTORE DATA
                    ================================= */

                    let userData = null;


                    snapshot.forEach(
                        function(doc) {

                            userData = {

                                id: doc.id,

                                ...doc.data()

                            };

                        }
                    );


                    console.log(
                        "Firestore User:",
                        userData
                    );


                    /* =================================
                       STEP 5
                       GET ROLE
                    ================================= */

                    const role =
                        String(
                            userData.role || ""
                        )
                        .trim()
                        .toLowerCase();


                    /* =================================
                       ROLE MISSING
                    ================================= */

                    if (
                        role === ""
                    ) {

                        await auth.signOut();


                        showMessage(
                            "❌ User role is not assigned.",
                            "error"
                        );


                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";


                        return;

                    }


                    /* =================================
                       STEP 6
                       SAVE USER DATA
                    ================================= */

                    localStorage.setItem(
                        "userEmail",
                        user.email
                    );


                    localStorage.setItem(
                        "userUid",
                        user.uid
                    );


                    localStorage.setItem(
                        "userName",
                        userData.name || ""
                    );


                    localStorage.setItem(
                        "username",
                        userData.username || ""
                    );


                    localStorage.setItem(
                        "userRole",
                        role
                    );


                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );


                    /* =================================
                       STEP 7
                       ROLE BASED REDIRECT
                    ================================= */

                    showMessage(
                        "✅ Login successful! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function() {


                            /* =========================
                               STUDENT
                            ========================= */

                            if (
                                role === "student"
                            ) {

                                window.location.href =
                                    "student-dashboard.html";

                            }


                            /* =========================
                               FACULTY
                            ========================= */

                            else if (
                                role === "faculty"
                            ) {

                                window.location.href =
                                    "faculty-dashboard.html";

                            }


                            /* =========================
                               ADMIN
                            ========================= */

                            else if (
                                role === "admin"
                            ) {

                                window.location.href =
                                    "admin-dashboard.html";

                            }


                            /* =========================
                               INVALID ROLE
                            ========================= */

                            else {

                                auth.signOut();


                                localStorage.clear();


                                showMessage(
                                    "❌ Invalid role: " +
                                    role,
                                    "error"
                                );


                                loginButton.disabled =
                                    false;

                                loginButton.textContent =
                                    "Login";

                            }

                        },
                        700
                    );


                }


                /* =====================================
                   LOGIN ERROR
                ====================================== */

                catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    let errorMessage =
                        "❌ Login failed. Please try again.";


                    /* ===============================
                       INVALID CREDENTIAL
                    =============================== */

                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        errorMessage =
                            "❌ Invalid email or password.";

                    }


                    /* ===============================
                       USER NOT FOUND
                    =============================== */

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        errorMessage =
                            "❌ No account found with this email.";

                    }


                    /* ===============================
                       WRONG PASSWORD
                    =============================== */

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        errorMessage =
                            "❌ Incorrect password.";

                    }


                    /* ===============================
                       INVALID EMAIL
                    =============================== */

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        errorMessage =
                            "❌ Invalid email address.";

                    }


                    /* ===============================
                       TOO MANY REQUESTS
                    =============================== */

                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        errorMessage =
                            "⚠️ Too many login attempts. Please try again later.";

                    }


                    /* ===============================
                       NETWORK ERROR
                    =============================== */

                    else if (
                        error.code ===
                        "auth/network-request-failed"
                    ) {

                        errorMessage =
                            "❌ Network error. Check your internet connection.";

                    }


                    /* ===============================
                       FIRESTORE PERMISSION
                    =============================== */

                    else if (
                        error.code ===
                        "permission-denied"
                    ) {

                        errorMessage =
                            "❌ Firestore permission denied. Check your Firestore Rules.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );


        /* =========================================
           FORGOT PASSWORD
        ========================================== */

        forgotPassword.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                /* =================================
                   EMAIL REQUIRED
                ================================= */

                if (
                    email === ""
                ) {

                    showMessage(
                        "⚠️ First enter your email address.",
                        "error"
                    );


                    emailInput.focus();


                    return;

                }


                try {


                    showMessage(
                        "Sending reset email...",
                        "loading"
                    );


                    await
                    sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "✅ Password reset email sent. Check your inbox.",
                        "success"
                    );


                }


                catch (error) {

                    console.error(
                        "Password Reset Error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        showMessage(
                            "❌ No account found with this email.",
                            "error"
                        );

                    }


                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        showMessage(
                            "❌ Invalid email address.",
                            "error"
                        );

                    }


                    else {

                        showMessage(
                            "❌ Unable to send password reset email.",
                            "error"
                        );

                    }

                }

            }
        );


        /* =========================================
           MESSAGE FUNCTION
        ========================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;

        }

    </script>

</body>

</html>
