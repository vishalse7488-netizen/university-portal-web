<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Portal - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #64d8df,
                #65aaf0
            );
        }

        .login-container {
            width: 100%;
            max-width: 440px;

            background: white;

            padding: 42px 34px;

            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            text-align: center;

            margin: 20px;
        }

        .logo {
            width: 78px;
            height: 78px;

            border-radius: 50%;

            background: #4caf50;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 18px;

            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0;

            color: #222;

            font-size: 28px;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 28px;

            color: #777;

            font-size: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #c8c8c8;

            border-radius: 7px;

            font-size: 16px;

            outline: none;

            background: #f5f8ff;
        }

        input:focus {
            border-color: #4caf50;

            box-shadow:
                0 0 0 2px rgba(76, 175, 80, 0.12);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #4caf50;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #43a047;
        }

        .login-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }

        .forgot {
            display: block;

            margin-top: 20px;

            color: #1976d2;

            text-decoration: none;

            font-size: 15px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .register-text {
            margin-top: 24px;

            color: #666;

            font-size: 15px;
        }

        .register-text a {
            color: #4caf50;

            font-weight: bold;

            text-decoration: none;
        }

        .message {
            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 7px;

            font-size: 14px;

            line-height: 1.5;
        }

        .error {
            display: block;

            color: #d32f2f;

            background: #ffebee;
        }

        .success {
            display: block;

            color: #2e7d32;

            background: #e8f5e9;
        }

        @media (max-width: 600px) {

            .login-container {
                margin: 15px;

                padding: 32px 22px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                width: 70px;
                height: 70px;

                font-size: 36px;
            }

            input {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>


<div class="login-container">


    <div class="logo">
        U
    </div>


    <h1>
        University Portal
    </h1>


    <div class="subtitle">
        Login to continue
    </div>


    <form id="loginForm">


        <div class="input-group">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

        </div>


        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login
        </button>


    </form>


    <a
        href="#"
        class="forgot"
        id="forgotPassword"
    >
        Forgot Password?
    </a>


    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


    <div
        id="message"
        class="message"
    ></div>


</div>



<!-- Firebase SDK -->

<script type="module">

    // =========================================
    // FIREBASE IMPORTS
    // =========================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================================
    // YOUR FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

        authDomain:
            "university-portal-2107e.firebaseapp.com",

        projectId:
            "university-portal-2107e",

        storageBucket:
            "university-portal-2107e.firebasestorage.app",

        messagingSenderId:
            "50848903813",

        appId:
            "1:50848903813:web:8296090d0d9268cfd2efec",

        measurementId:
            "G-LKTX7C7F0E"
    };


    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    const app =
        initializeApp(firebaseConfig);


    // Firebase Authentication

    const auth =
        getAuth(app);


    // Firestore

    const db =
        getFirestore(app);


    // =========================================
    // HTML ELEMENTS
    // =========================================

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginBtn =
        document.getElementById("loginBtn");

    const message =
        document.getElementById("message");

    const forgotPassword =
        document.getElementById("forgotPassword");


    // =========================================
    // SHOW MESSAGE
    // =========================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    // =========================================
    // LOGIN
    // =========================================

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            showMessage(
                "Please wait...",
                "success"
            );


            try {

                // =================================
                // STEP 1
                // Firebase Authentication
                // =================================

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // =================================
                // STEP 2
                // GET FIREBASE UID
                // =================================

                const uid =
                    user.uid;


                // =================================
                // STEP 3
                // GET USER FROM FIRESTORE
                //
                // users/{Firebase UID}
                // =================================

                const userRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const userSnapshot =
                    await getDoc(userRef);


                // =================================
                // USER PROFILE NOT FOUND
                // =================================

                if (!userSnapshot.exists()) {

                    showMessage(
                        "Login successful, but your user profile was not found in Firestore.",
                        "error"
                    );

                    loginBtn.disabled = false;

                    loginBtn.textContent =
                        "Login";

                    return;
                }


                // =================================
                // GET USER DATA
                // =================================

                const userData =
                    userSnapshot.data();


                const role =
                    userData.role;


                const name =
                    userData.name || "";


                const username =
                    userData.username || "";


                // =================================
                // CHECK ROLE
                // =================================

                if (
                    role !== "student" &&
                    role !== "faculty" &&
                    role !== "admin"
                ) {

                    showMessage(
                        "Invalid user role. Please contact administrator.",
                        "error"
                    );

                    loginBtn.disabled = false;

                    loginBtn.textContent =
                        "Login";

                    return;
                }


                // =================================
                // SAVE LOGIN INFORMATION
                // =================================

                localStorage.setItem(
                    "userEmail",
                    user.email
                );

                localStorage.setItem(
                    "userName",
                    name
                );

                localStorage.setItem(
                    "username",
                    username
                );

                localStorage.setItem(
                    "userRole",
                    role
                );

                localStorage.setItem(
                    "userUid",
                    uid
                );

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                // =================================
                // SUCCESS
                // =================================

                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                // =================================
                // ROLE BASED REDIRECT
                // =================================

                setTimeout(
                    function() {

                        if (role === "student") {

                            window.location.href =
                                "dashboard.html";

                        }

                        else if (role === "faculty") {

                            window.location.href =
                                "faculty-dashboard.html";

                        }

                        else if (role === "admin") {

                            window.location.href =
                                "admin.html";

                        }

                    },
                    500
                );


            }

            catch (error) {

                console.error(
                    "Firebase Login Error:",
                    error
                );


                let errorMessage =
                    "Login failed. Please try again.";


                // Firebase error messages

                switch (error.code) {

                    case "auth/invalid-email":

                        errorMessage =
                            "Invalid email address.";

                        break;


                    case "auth/user-not-found":

                        errorMessage =
                            "No account found with this email.";

                        break;


                    case "auth/wrong-password":

                        errorMessage =
                            "Incorrect password.";

                        break;


                    case "auth/invalid-credential":

                        errorMessage =
                            "Incorrect email or password.";

                        break;


                    case "auth/too-many-requests":

                        errorMessage =
                            "Too many login attempts. Please try again later.";

                        break;


                    case "auth/network-request-failed":

                        errorMessage =
                            "Network error. Check your internet connection.";

                        break;


                    case "permission-denied":

                        errorMessage =
                            "Firestore permission denied. Check your Firestore Rules.";

                        break;


                    default:

                        errorMessage =
                            "Firebase Error: " +
                            error.message;
                }


                showMessage(
                    errorMessage,
                    "error"
                );


                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";
            }

        }
    );


    // =========================================
    // FORGOT PASSWORD
    // =========================================

    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Please enter your email address first.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset email sent. Please check your inbox.",
                    "success"
                );

            }

            catch (error) {

                console.error(
                    error
                );


                showMessage(
                    "Unable to send password reset email.",
                    "error"
                );
            }

        }
    );

</script>


</body>

</html>
