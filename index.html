<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Portal - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #67dce8,
                    #64a8f4
                );

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 410px;

            background: #ffffff;

            padding: 42px 32px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.18);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #4caf50;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;
            font-weight: bold;
        }

        h2 {
            margin: 0;

            color: #222;

            font-size: 28px;
        }

        .subtitle {
            color: #777;

            margin: 10px 0 25px;
        }

        .input-box {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 7px;

            background: #f5f8ff;

            font-size: 16px;

            outline: none;
        }

        .input-box:focus {
            border-color: #4caf50;

            background: white;
        }

        #loginButton {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #4caf50;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        #loginButton:hover {
            background: #3f9f45;
        }

        #loginButton:disabled {
            background: #999;

            cursor: not-allowed;
        }

        .forgot-password {
            display: block;

            margin-top: 18px;

            color: #1976d2;

            text-decoration: none;
        }

        .register-text {
            margin-top: 22px;

            color: #555;

            font-size: 14px;
        }

        .register-text a {
            color: #4caf50;

            font-weight: bold;

            text-decoration: none;
        }

        #message {
            min-height: 25px;

            margin-top: 18px;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.5;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #2e7d32;
        }

        .loading {
            color: #1976d2;
        }

        @media (max-width: 450px) {

            body {
                padding: 12px;
            }

            .login-container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        U
    </div>


    <h2>
        University Portal
    </h2>


    <p class="subtitle">
        Login to continue
    </p>


    <form id="loginForm">


        <input
            type="email"
            id="email"
            class="input-box"
            placeholder="Email"
            autocomplete="email"
            required
        >


        <input
            type="password"
            id="password"
            class="input-box"
            placeholder="Password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


    </form>


    <a
        href="#"
        id="forgotPassword"
        class="forgot-password"
    >
        Forgot Password?
    </a>


    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


    <p id="message"></p>


</div>



<script type="module">


// =====================================================
// FIREBASE IMPORT
// =====================================================

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// =====================================================
// FIREBASE CONFIG
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCS7fUaY2HAov1ezFN9_lchZHHUA4lj8g",

    authDomain:
        "university-portal-2107e.firebaseapp.com",

    projectId:
        "university-portal-2107e",

    storageBucket:
        "university-portal-2107e.firebasestorage.app",

    messagingSenderId:
        "50848903813",

    appId:
        "1:50848903813:web:8296090d0d9268cfd2efec",

    measurementId:
        "G-LKTX7C7F0E"
};


// =====================================================
// INITIALIZE
// =====================================================

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


// =====================================================
// ELEMENTS
// =====================================================

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const forgotPassword =
    document.getElementById("forgotPassword");


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

    message.textContent = text;

    message.className = type;
}


// =====================================================
// LOGIN
// =====================================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "⚠️ Please enter email and password.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        showMessage(
            "Checking your account...",
            "loading"
        );


        try {


            // =================================================
            // STEP 1
            // FIREBASE AUTHENTICATION
            // =================================================

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "AUTH UID:",
                user.uid
            );


            console.log(
                "AUTH EMAIL:",
                user.email
            );


            // =================================================
            // STEP 2
            // FIRESTORE
            //
            // IMPORTANT:
            // users DOCUMENT ID = Firebase Auth UID
            // =================================================

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnapshot =
                await getDoc(userRef);


            console.log(
                "Firestore document exists:",
                userSnapshot.exists()
            );


            // =================================================
            // STEP 3
            // PROFILE CHECK
            // =================================================

            if (!userSnapshot.exists()) {

                await signOut(auth);


                showMessage(
                    "❌ Firestore profile not found. Create users/" +
                    user.uid,
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";


                return;
            }


            // =================================================
            // STEP 4
            // USER DATA
            // =================================================

            const userData =
                userSnapshot.data();


            console.log(
                "USER DATA:",
                userData
            );


            // =================================================
            // STEP 5
            // ROLE
            // =================================================

            const role =
                String(
                    userData.role || ""
                )
                .trim()
                .toLowerCase();


            console.log(
                "USER ROLE:",
                role
            );


            if (
                role !== "student" &&
                role !== "faculty" &&
                role !== "admin"
            ) {

                await signOut(auth);


                showMessage(
                    "❌ Invalid user role.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";


                return;
            }


            // =================================================
            // STEP 6
            // SAVE LOGIN DATA
            // =================================================

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            localStorage.setItem(
                "userUid",
                user.uid
            );


            localStorage.setItem(
                "userEmail",
                user.email || email
            );


            localStorage.setItem(
                "userName",
                userData.name || ""
            );


            localStorage.setItem(
                "username",
                userData.username || ""
            );


            localStorage.setItem(
                "userRole",
                role
            );


            // =================================================
            // STEP 7
            // REDIRECT
            // =================================================

            showMessage(
                "✅ Login successful!",
                "success"
            );


            setTimeout(
                function() {


                    if (
                        role === "student"
                    ) {

                        window.location.href =
                            "dashboard.html";

                    }


                    else if (
                        role === "faculty"
                    ) {

                        window.location.href =
                            "faculty-dashboard.html";

                    }


                    else if (
                        role === "admin"
                    ) {

                        window.location.href =
                            "admin-dashboard.html";

                    }

                },
                500
            );

        }


        catch (error) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            let text =
                "❌ Login failed.";


            switch (error.code) {


                case "auth/invalid-credential":

                    text =
                        "❌ Invalid email or password.";

                    break;


                case "auth/user-not-found":

                    text =
                        "❌ Firebase Authentication account not found.";

                    break;


                case "auth/wrong-password":

                    text =
                        "❌ Incorrect password.";

                    break;


                case "auth/invalid-email":

                    text =
                        "❌ Invalid email address.";

                    break;


                case "auth/too-many-requests":

                    text =
                        "⚠️ Too many attempts. Try again later.";

                    break;


                case "auth/network-request-failed":

                    text =
                        "❌ Network error. Check your internet.";

                    break;


                case "permission-denied":

                    text =
                        "❌ Firestore permission denied. Check users UID and Rules.";

                    break;


                default:

                    text =
                        "❌ " +
                        (
                            error.message ||
                            "Login failed."
                        );

                    break;
            }


            showMessage(
                text,
                "error"
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

        }

    }
);


// =====================================================
// FORGOT PASSWORD
// =====================================================

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            showMessage(
                "⚠️ First enter your email.",
                "error"
            );

            emailInput.focus();

            return;
        }


        try {


            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "✅ Password reset email sent.",
                "success"
            );


        }
        catch (error) {

            console.error(
                error
            );


            showMessage(
                "❌ Unable to send password reset email.",
                "error"
            );

        }

    }
);

</script>


</body>

</html>
