<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FACULTY DASHBOARD</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            background: #f4f6f8;

            min-height: 100vh;

        }


        /* =========================
           TOP NAVBAR
        ========================= */

        .navbar {

            background: #007BFF;

            color: white;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: relative;

            min-height: 60px;

        }


        .navbar h1 {

            font-size: 20px;

            margin: 0;

            font-weight: 500;

        }


        .center-title {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-size: 22px;

            font-weight: bold;

            letter-spacing: 1px;

            white-space: nowrap;

        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-btn {

            color: white;

            text-decoration: none;

            background: #dc3545;

            padding: 8px 15px;

            border-radius: 5px;

            transition: 0.3s;

            cursor: pointer;

        }


        .logout-btn:hover {

            background: #c82333;

        }


        /* =========================
           MENU BAR
        ========================= */

        .menu-bar {

            background: #0056b3;

            display: flex;

            justify-content: flex-start;

            align-items: center;

            padding: 10px 20px;

            gap: 30px;

            overflow-x: auto;

        }


        .menu-bar a {

            color: white;

            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;

            white-space: nowrap;

        }


        .menu-bar a:hover {

            color: #FFD700;

            text-decoration: underline;

        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {

            position: relative;

            text-align: center;

            margin-top: 50px;

            min-height: 65vh;

            padding: 40px 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* =========================
           BACKGROUND LOGO
        ========================= */

        .content::before {

            content: "";

            background-image: url(
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROm-q6zzbd-JBo9REw4aL4FtlpVUmek1sWlA&s"
            );

            background-repeat: no-repeat;

            background-position: center;

            background-size: 300px 300px;

            opacity: 0.15;

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 0;

        }


        .content h2,
        .content > p,
        .dashboard-card {

            position: relative;

            z-index: 1;

        }


        .content h2 {

            color: #333;

            font-size: 30px;

            margin-bottom: 10px;

        }


        .content > p {

            color: #555;

            font-size: 17px;

        }


        /* =========================
           FACULTY CARD
        ========================= */

        .dashboard-card {

            margin-top: 20px;

            background: rgba(255, 255, 255, 0.94);

            padding: 25px 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

            width: 100%;

            max-width: 500px;

        }


        .dashboard-card h3 {

            margin-top: 0;

            color: #007BFF;

        }


        .user-info {

            margin-top: 20px;

            text-align: left;

        }


        .user-info div {

            padding: 10px 0;

            border-bottom: 1px solid #eee;

        }


        .user-info div:last-child {

            border-bottom: none;

        }


        .label {

            font-weight: bold;

            color: #333;

        }


        .value {

            color: #555;

        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            position: relative;

            z-index: 5;

            color: #007BFF;

            font-size: 18px;

            font-weight: bold;

        }


        /* =========================
           ERROR
        ========================= */

        #errorBox {

            display: none;

            position: relative;

            z-index: 5;

            background: #fff;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

            max-width: 500px;

            width: 100%;

        }


        #errorBox h2 {

            color: #dc3545;

            margin-top: 0;

        }


        #errorMessage {

            color: #555;

            line-height: 1.6;

        }


        .login-btn {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 20px;

            background: #007BFF;

            color: white;

            text-decoration: none;

            border-radius: 6px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 12px;

                min-height: 100px;

                flex-direction: column;

                gap: 12px;

                justify-content: center;

            }


            .navbar h1 {

                font-size: 15px;

                text-align: center;

            }


            .center-title {

                position: static;

                transform: none;

                font-size: 20px;

                order: -1;

            }


            .logout-btn {

                padding: 7px 14px;

                font-size: 14px;

            }


            .menu-bar {

                flex-direction: column;

                gap: 12px;

                padding: 14px;

            }


            .menu-bar a {

                font-size: 15px;

            }


            .content {

                margin-top: 20px;

                min-height: 65vh;

                padding: 30px 15px;

            }


            .content h2 {

                font-size: 24px;

            }


            .content > p {

                font-size: 15px;

            }


            .dashboard-card {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <h1 id="welcomeText">
            Welcome 👋
        </h1>


        <div class="center-title">
            Faculty Dashboard
        </div>


        <a
            href="#"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </a>

    </div>


    <!-- =========================
         MENU
    ========================= -->

    <div class="menu-bar">

        <a href="school.html">
            Menu
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="about.html">
            About
        </a>

        <a href="location.html">
            Location
        </a>

        <a href="feedback.html">
            Feedback
        </a>

        <a href="contact.html">
            Contact Us
        </a>

    </div>


    <!-- =========================
         CONTENT
    ========================= -->

    <div class="content">


        <!-- Loading -->

        <div id="loading">
            Loading Faculty Account...
        </div>


        <!-- Error -->

        <div id="errorBox">

            <h2>
                Access Denied
            </h2>

            <p id="errorMessage">
                Unable to load faculty account.
            </p>

            <a
                href="index.html"
                class="login-btn"
            >
                Go to Login
            </a>

        </div>


        <!-- Dashboard -->

        <div
            id="dashboard"
            style="display:none;"
        >

            <h2>
                Faculty Dashboard
            </h2>


            <p>
                You are successfully logged in.
            </p>


            <div class="dashboard-card">

                <h3>
                    👨‍🏫 Faculty Account
                </h3>


                <div class="user-info">


                    <div>

                        <span class="label">
                            Name:
                        </span>

                        <span
                            class="value"
                            id="userName"
                        >
                            -
                        </span>

                    </div>


                    <div>

                        <span class="label">
                            Username:
                        </span>

                        <span
                            class="value"
                            id="userUsername"
                        >
                            -
                        </span>

                    </div>


                    <div>

                        <span class="label">
                            Email:
                        </span>

                        <span
                            class="value"
                            id="userEmail"
                        >
                            -
                        </span>

                    </div>


                    <div>

                        <span class="label">
                            Role:
                        </span>

                        <span
                            class="value"
                            id="userRole"
                        >
                            -
                        </span>

                    </div>


                </div>

            </div>

        </div>


    </div>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCS7fUaY2HAov1ezlFN9_lchZHHUA4lj8g",

            authDomain:
                "university-portal-2107e.firebaseapp.com",

            projectId:
                "university-portal-2107e",

            storageBucket:
                "university-portal-2107e.firebasestorage.app",

            messagingSenderId:
                "50848903813",

            appId:
                "1:50848903813:web:8296090d0d9268cfd2efec",

            measurementId:
                "G-LKTX7C7F0E"

        };


        /* =========================
           INITIALIZE FIREBASE
        ========================= */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        /* =========================
           HTML ELEMENTS
        ========================= */

        const loading =
            document.getElementById("loading");


        const errorBox =
            document.getElementById("errorBox");


        const errorMessage =
            document.getElementById("errorMessage");


        const dashboard =
            document.getElementById("dashboard");


        /* =========================
           AUTH STATE
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                try {

                    /*
                     * User login nahi hai
                     */

                    if (!user) {

                        window.location.href =
                            "index.html";

                        return;

                    }


                    /*
                     * Firebase Authentication
                     * ka actual UID
                     */

                    const uid =
                        user.uid;


                    console.log(
                        "Firebase UID:",
                        uid
                    );


                    /*
                     * Firestore users/{UID}
                     */

                    const userRef =
                        doc(
                            db,
                            "users",
                            uid
                        );


                    const userSnapshot =
                        await getDoc(userRef);


                    /*
                     * Profile nahi mila
                     */

                    if (!userSnapshot.exists()) {

                        throw new Error(
                            "Faculty profile not found. Firestore users document ID must be exactly: "
                            + uid
                        );

                    }


                    /*
                     * Profile data
                     */

                    const data =
                        userSnapshot.data();


                    console.log(
                        "Firestore User:",
                        data
                    );


                    /*
                     * Role check
                     */

                    if (data.role !== "faculty") {

                        throw new Error(
                            "Access denied. This account has role: "
                            + (data.role || "unknown")
                        );

                    }


                    /*
                     * Show information
                     */

                    document.getElementById(
                        "userName"
                    ).textContent =
                        data.name || "Faculty";


                    document.getElementById(
                        "userUsername"
                    ).textContent =
                        data.username || "-";


                    document.getElementById(
                        "userEmail"
                    ).textContent =
                        data.email || user.email || "-";


                    document.getElementById(
                        "userRole"
                    ).textContent =
                        data.role;


                    document.getElementById(
                        "welcomeText"
                    ).textContent =
                        "Welcome, "
                        + (data.name || "Faculty")
                        + " 👋";


                    /*
                     * Loading hide
                     */

                    loading.style.display =
                        "none";


                    /*
                     * Dashboard show
                     */

                    dashboard.style.display =
                        "block";

                }


                catch (error) {

                    console.error(
                        "Faculty Dashboard Error:",
                        error
                    );


                    loading.style.display =
                        "none";


                    dashboard.style.display =
                        "none";


                    errorBox.style.display =
                        "block";


                    errorMessage.textContent =
                        error.message;

                }

            }
        );


        /* =========================
           LOGOUT
        ========================= */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async function(event) {

                    event.preventDefault();


                    try {

                        await signOut(auth);


                        window.location.href =
                            "index.html";

                    }


                    catch (error) {

                        console.error(
                            "Logout Error:",
                            error
                        );

                    }

                }
            );

    </script>


</body>

</html>
